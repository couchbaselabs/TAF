# Fusion Large Scale Testing Configuration
# Target: 150GB per VB with 2, 4, 8 VBs (300GB - 1.2TB total)
#
# Doc size: 4096 bytes (4KB)
# To achieve 150GB per VB:
#   - 150GB / 4KB = ~39,321,600 docs per VB
#   - For 2 VBs: ~78,643,200 total docs (num_items=78000000)
#   - For 4 VBs: ~157,286,400 total docs (num_items=157000000)
#   - For 8 VBs: ~314,572,800 total docs (num_items=314000000)
#
# Common params:
#   - doc_size=4096
#   - load_docs_using=sirius_java_sdk
#   - fusion_test=True
#   - bucket_ram_quota=4096 (4GB RAM per bucket)
#   - sdk_timeout=120 (longer timeout for large ops)
#   - ops_rate=50000


###############################################################################
