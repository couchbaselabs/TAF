storage.fusion.fusion_backup_restore.FusionBackupRestore:

    ##### Simulated Capella EBS snapshot backup/restore (source -> dest clone) #####
    # No real backup/restore: the source cluster's on-disk state (config + local
    # data) is copied onto a separate set of destination nodes, node_remap
    # rewrites the node identities + log store URI (disable auto-failover + boot
    # with Fusion disabled), the destination is brought online as its own
    # cluster and Fusion is re-enabled so sync/migration resume.
    # The test sets the rebalance direction internally, so num_nodes_to_* are
    # intentionally not passed here.
    #
    # Server-count note: the destination is a SEPARATE set of nodes, one per
    # live source node at clone time, and the source stays running. Server count
    # comes from the .ini, not this conf - ensure the .ini lists enough servers.
    #
    # Optional: dest_fusion_log_store_uri=<uri> sets the destination's log store
    # explicitly. If omitted it is derived by suffixing "_dest" onto
    # fusion_log_store_uri (e.g. local:///mnt/nfs/share/buckets_dest) and, for an
    # NFS store, its backing dir is auto-created on the NFS server.

    # Variation 1: active guest volumes present across the clone.
    # Start with 2 nodes, pause migration (rate limit 0), rebalance-out a node
    # (creates active guest volumes on the survivor -> 1-node source), clone onto
    # 1 destination node, verify guest volumes recover and a subsequent
    # rebalance-in works.
    # Needs 3 servers: 1 source + 1 destination + 1 spare for the rebalance-in.
    test_backup_restore_with_guest_volumes,num_items=5000000,nodes_init=2,sdk_timeout=60,ops_rate=30000,replicas=0,init_loading=False,bucket_ram_quota=1024,doc_size=3072,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_migration_rate_limit=78643200,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=backup_restore;P0

    # Variation 2: no active guest volumes across the clone.
    # Start with 1 node, rebalance-in a node (-> 2-node source), let background
    # migration drain (no guest volumes), clone onto 2 destination nodes, verify
    # none recover and a subsequent rebalance-out works.
    # Needs 4 servers: 2 source + 2 destination (source stays live during the
    # clone, so the destination cannot reuse the source nodes).
    test_backup_restore_without_guest_volumes,num_items=5000000,nodes_init=1,sdk_timeout=60,ops_rate=30000,replicas=0,init_loading=False,bucket_ram_quota=1024,doc_size=3072,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_migration_rate_limit=78643200,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=backup_restore;P0
