# Fusion CP Resiliency — Cloud (Capella) Tests
#
# Automates most of COVERAGE.md §9 "CP Resiliency", plus one §10 "Crash Recovery —
# Server" row (test_crash_memcached_during_s3_upload — disable/load/enable/kill/
# rebalance, no other test in this file needs the fusion enable-transition or
# _trigger_rebalance() combination this one does; filed here anyway since this file
# already has the needed _stage/_run_on_cluster_node/_trigger_rebalance machinery;
# see that test's own docstring for why it isn't in fusion_accelerator_chaos_test.py,
# fusion_health_test.py, or fusion_enable_disable_test.py instead):
#   §9  test_dp_accelerator_crash_during_download        Crash dp-accelerator mid-download
#   §9  test_kill_cp_job_during_scaling                  Keep crashing CP job N times
#   §9  test_kill_memcached_during_rebalance              ns_server loses PlanUUID
#                                                          (STAGE_TEST_MATRIX.md boundary D)
#   §9  test_restart_kv_node_during_guest_volume_mounting Restart node during mounting
#   §9  test_terminate_kv_node_during_guest_volume_mounting Terminate node during mounting
#   §9  test_terminate_kv_node_after_guest_volumes_attached Terminate node after attach
#   §9  test_restart_accelerator_node_mid_download        Restart accelerator mid-download
#   §9  test_delete_s3_log_file_accelerator_cli_failure   Delete log file from S3
#   §9  test_corrupt_log_files_on_guest_volumes            Corrupt log files (junk bytes)
#   §9  test_delete_log_files_from_guest_volumes_after_attachment  Delete (not corrupt)
#   §9  test_delete_log_files_from_guest_volumes_during_download   Delete accelerator-side
#                                                                   files mid-Phase-5
# §15 "Node Health / Auto-Failover" tests (test_pause_memcached_during_migration,
# test_autofailover_kv_node_during_migration) moved to fusion_node_health_test.py /
# conf/fusion/cloud/fusion_node_health_test.conf — a different mechanism (classic
# ns_server auto-failover) from everything else in this file (Capella's CP-driven
# node-replacement flow), so it got its own file once a second test made "one row"
# stop being an excuse to keep sharing this one.
# See fusion_cp_resiliency_test.py's module docstring for the ACCELERATION.md grounding
# and, for the job-kill row, exactly what is and isn't confirmed safe about the endpoint.
#
# Required: -p aws_access_key=<key>,aws_secret_key=<secret>
#
# fusion_min_split_size_gb=10 forces several shards/accelerators per host so the fleet
# snapshot taken before the kill (see CPR1) is meaningful, and so one crashed accelerator
# is not the cluster's only chance to take the fusion path at all.
#
# create_end=50000000 (2x the lifecycle conf's baseline) because fusion shards are wildly
# uneven: a run at create_end=25000000 observed 2 of 4 shards for a single scale-out
# already handed off to a KV node within ~10-20s of their accelerator even launching, and
# the one picked as a target had ALSO finished before the very next check 15s later. The
# test itself now searches the fleet for a still-downloading accelerator rather than
# grabbing the first one (see _find_downloading_accelerator), but a bigger, slower-to-
# download data set makes that search land inside the window far more often.
# dp_accelerator_target_timeout=600 bounds how long that search runs before giving up.
#
# fusion_download_rate_limit=52428800 (50 MB/s) throttles the accelerator's own S3
# download (PATCHed to accelerator.download.rateLimit by the same
# _apply_fusion_config_from_params() call that sets fusion_min_split_size_gb, already
# invoked by this test) for the WHOLE test — one value throughout, not raised after the
# crash. An earlier version tried a low-then-high pair (100 KB/s pre-crash, 100 MB/s
# post-crash), which does not work: changing accelerator.download.rateLimit mid-flight
# has no effect on a download already in progress (confirmed with the fusion/CP team),
# so the 100 KB/s run simply never finished downloading regardless of what was PATCHed
# in afterward. 50 MB/s was chosen from a real run that still had multiple accelerators
# genuinely mid-download 122s into the target search (so the crash window is real)
# while staying fast enough that every shard should plausibly finish within the ~30
# minute range the rest of the test (rebalance completion + teardown) budgets for.
# Lower it if CPR1 ever fails to find a live target; raise it if the test is taking
# noticeably longer than ~30 minutes end to end.
#
# fusion_sync_rate_limit=78643200 (75 MB/s/node) is read by the shared
# _wait_for_log_store_sync (fusion_accelerator_lifecycle_test.py) to estimate how long
# the S3 sync itself takes to transfer this load's data, on top of the
# fusion_upload_interval/fusion_upload_settle wait for the sync to START. Override it if
# the cluster's actual fusion_sync_rate_limit differs.
#
# test_kill_cp_job_during_scaling automates COVERAGE.md §9's "Keep crashing CP job N
# times (retry resilience)" row using CapellaUtils.kill_deployment_job (POST
# /internal/support/jobs/{jobId}/kill — see the module docstring for exactly what is and
# isn't confirmed safe about calling this on an otherwise-healthy job). Despite the row
# title, the job is killed only ONCE — no fusion_download_rate_limit needed here either,
# the target is the CP job itself, not an accelerator process, so there's no download
# window to widen. A killed job does NOT auto-retry (confirmed with the fusion/CP team)
# — after the kill, the test issues a "no-op deploy" (CapellaUtils.redeploy_cluster_spec_v4,
# fetching the cluster's own current spec via the public v4 API and PUTting it back
# unmodified) to un-stick it, then asserts no orphaned accelerator instances/guest
# volumes remain regardless of the final outcome. NOT redeploy_cluster_spec (the internal
# v2 /specs POST) — confirmed against a real cluster, the CP rejects that one outright
# with "scaling already in progress" rather than treating it as a no-op, since the killed
# job already left the cluster mid-scale. The v4 bearer token this needs is minted and
# torn down per attempt via CapellaUtils.create_v4_api_key()/delete_v4_api_key().
#   cp_job_find_timeout=180              how long to wait for the job to appear at all
#   cp_job_processing_wait_timeout=300   how long to wait for the job to be "processing"
#                                        before the kill attempt
#   cp_job_post_kill_settle_secs=30      wait after the kill (and after the no-op
#                                        deploy) before re-reading the job
#   cp_noop_deploy_attempts=5            max attempts to re-submit the same target spec
#                                        if the CP rejects it (e.g. cluster still
#                                        settling from the kill)
#   cp_noop_deploy_retry_interval_secs=15  wait between no-op deploy attempts
#   cp_noop_deploy_force=True             EXPERIMENTAL: adds "Force": true to the no-op
#                                        deploy's PUT payload (redeploy_cluster_spec_v4).
#                                        A real run got a clean 422 ("status is 'scaling',
#                                        only Draft or Healthy allowed") even from the
#                                        plain (unforced) resubmit, while the Fleet Manager
#                                        UI's own "redeploy" button was reported to work
#                                        against the same kind of stuck cluster -- the only
#                                        evidence for this flag is the killed job's own
#                                        payload carrying 'Force': False. Not confirmed to
#                                        be read by this endpoint at all; set to False to
#                                        go back to the plain resubmit if so.
#
# test_restart_kv_node_during_guest_volume_mounting / test_terminate_kv_node_during_
# guest_volume_mounting automate COVERAGE.md §9's "Restart / terminate node during guest
# volume mounting" row. UNLIKE every test above, these act on a live, data-serving KV
# node's own EC2 instance, not an ephemeral accelerator or a CP job — see the module
# docstring before running either against a cluster anything else depends on.
#   kv_node_target_timeout=900              how long to search for a KV node with a
#                                            guest volume freshly attached (Phase 6)
#   kv_node_recovery_timeout=900             (restart only) how long to wait for the
#                                            node's /proc/uptime to reset post-reboot
#   kv_node_terminate_recovery_timeout=1800  (terminate only) how long to wait for a
#                                            replacement node or a clean resolution —
#                                            longer than the restart timeout since
#                                            provisioning a replacement instance is
#                                            expected to take longer than a reboot
#
# test_terminate_kv_node_during_guest_volume_mounting is NOT reversible for the targeted
# instance. Recovery depends entirely on Capella's own node-replacement flow, which this
# codebase has not exercised for a KV node lost mid-rebalance before now — a bad outcome
# may leave the cluster needing manual remediation. Run it on a disposable cluster, not
# one anything else in a shared test run still depends on.
#
# test_terminate_kv_node_after_guest_volumes_attached automates COVERAGE.md §9's
# "Terminate node after all guest volumes attached" row — a LATER boundary than the
# mounting-phase test above: the rebalance has already completed and every guest volume
# is attached; the fault lands during Phase 8's background migration instead. Also
# DESTRUCTIVE / NOT REVERSIBLE for the targeted instance — same caution as above.
#   kv_terminate_migration_rate_limit=1048576 (1 MB/s) is set BEFORE the rebalance
#     triggers, so migration is still genuinely copying data when the termination lands.
#     Unlike the mounting-phase tests, migration IS data-transfer bound, so this is a
#     real, working throttle (mirrors fusion_download_rate_limit's role for the
#     accelerator-crash test). Raised back to fusion_migration_rate_limit (75 MB/s,
#     default) once the replacement node is confirmed holding the re-attached volume(s).
#   migration_start_timeout=600               how long to wait for
#                                              ep_fusion_migration_completed_bytes > 0
#                                              before concluding migration never started
#   kv_node_migration_terminate_recovery_timeout=1800  how long to wait for a replacement
#                                              node to appear holding the same guest
#                                              volume(s) after the termination
#
# test_restart_accelerator_node_mid_download automates COVERAGE.md §9's "Restart
# accelerator nodes mid-download" row — a THIRD accelerator fault distinct from
# test_dp_accelerator_crash_during_download (kills only the dp-accelerator process) and
# fusion_accelerator_chaos_test.py's terminate/stop tests: this reboots the whole
# accelerator instance over SSM. Same fusion_download_rate_limit lesson applies — one
# value for the whole test, not raised after the reboot.
#   accelerator_restart_recovery_timeout=900  how long to wait for either the same
#                                              instance's /proc/uptime to reset, or a
#                                              replacement accelerator to appear
#
# test_delete_s3_log_file_accelerator_cli_failure automates COVERAGE.md §9's "Delete log
# file from S3 -> accelerator-cli failure" row. Deletes a large chunk of individual
# log-file objects (never a whole shard folder — see FusionAWSUtil.corrupt_fusion_log_
# store's num_folders=0 in the test) from the fusion S3 log store BEFORE the rebalance
# triggers, so accelerator-cli fails to download whichever shard(s) those objects
# belonged to. UNLIKE every other test in this file, healthy is the ONLY accepted
# outcome — a failed or stuck-in-scaling rebalance both fail this test (see the module
# docstring for the known real risk of the CP never reacting to a corrupted log store,
# from fusion_cluster_destroy_test.py's test_destroy_in_scale_failed_state).
#   s3_log_files_to_delete=128               number of individual S3 log-file objects to
#                                             delete before the rebalance. A real run's
#                                             log store held 256 objects total (2 per
#                                             vBucket x 128 vBuckets) at this conf's data
#                                             size, and only a fraction of the vBuckets
#                                             move on a scale-out — deleting just a
#                                             couple gave a low chance of ever landing on
#                                             a vBucket actually in this rebalance's
#                                             manifest. ~Half the log store is deleted so
#                                             a hit is very likely regardless of exactly
#                                             which vBuckets this run's shard(s) cover.
#                                             Recompute if create_end/collections/vBucket
#                                             count differ from this conf.
#   s3_log_corruption_recovery_timeout=1800  how long to wait for the rebalance to
#                                             complete (or fail) before concluding the CP
#                                             is hung on the missing object
#
# test_kill_memcached_during_rebalance automates STAGE_TEST_MATRIX.md boundary D's
# "ns_server loses PlanUUID (ErrFusionPlanNotFound)" row — see the module docstring for
# why it never manually re-triggers the rebalance after the kill, unlike the on-prem
# fusion_failover_rebalance.py::test_fusion_rebalance_crash_retry it is inspired by.
#
# The phase-7 CBS rebalance window is SMALL — test_abort_rebalance_invalidates_manifest
# (fusion_accelerator_chaos_test.py) measured one run at 17s start-to-finish — so this
# reuses that test's two window-widening levers: fusion_min_split_size_gb=2 (smaller
# shards -> more vBuckets moving) and kill_bg_load=True (continuous update traffic that
# each in-flight vBucket move has to chase through DCP instead of a flat copy). Same
# fusion_min_split_size_gb/fusion_max_slots/doc_size/create_end values as that test's
# own conf line, for the same reason.
#   kill_bg_load=True                   background update workload (rebl_ops_rate) run
#                                        from before the rebalance triggers through the
#                                        kill, to widen the phase-7 window
#   rebl_ops_rate=5000                  update ops/sec for the background load
#   guest_volume_transfer_timeout        how long to wait for at least one guest volume
#     (default: gv_launch_timeout)      to actually be attached to a real KV node
#                                        (phase 6) before picking kill targets — NOT
#                                        just "attached to something", since a naive
#                                        check here previously landed the kill on
#                                        accelerator instances instead (see the module
#                                        docstring's "KNOWN BUG, FIXED" note)
#   cbs_rebalance_wait_timeout=1800     how long to wait for CBS to report a rebalance
#                                        running (phase 7) before concluding it was
#                                        never reached
#   kill_at_progress_pct=0              minimum vBucket-movement progress required
#                                        before the kill lands (0 = as soon as CBS
#                                        reports running at all)
#   kill_progress_ceiling_pct=90        flags (does not fail) a kill landing above this
#                                        progress as an unproven run — it may simply
#                                        have finished on its own
#   cbs_rebalance_poll_interval=5       must stay short: with no way to stall the
#                                        rebalance on Capella, a slow cadence can sample
#                                        once and miss the window entirely
#   memcached_restart_timeout=300       how long to wait for ns_server to bring
#                                        memcached back up on the killed node
#   kill_memcached_recovery_timeout=3600  how long to wait for the cluster to reach
#                                        'healthy' after the kill, covering however
#                                        many CP job-level retries that takes
#
# Background migration is frozen (rate limit 0) for the whole test, resumed only once
# the cluster is confirmed healthy — see the module docstring's "MIGRATION IS FROZEN"
# paragraph. This makes it possible to assert every guest volume attached before the
# kill is still there after it (nothing but the kill's own side effects could have
# reclaimed one while frozen), a direct check for the row's "CBS loses the PlanUUID and
# tears down the plan early" failure mode. Teardown (no orphaned accelerator instances
# or EBS volumes) is validated only after migration resumes, same ordering every other
# migration-freezing chaos test here uses.
#
# test_pause_memcached_during_migration / test_autofailover_kv_node_during_migration
# moved to fusion_node_health_test.py / conf/fusion/cloud/fusion_node_health_test.conf
# (COVERAGE.md §15) -- see that conf file's header comment for their param docs.
#
# test_corrupt_log_files_on_guest_volumes automates COVERAGE.md §9's "Corrupt log files
# on guest volumes (junk bytes)" row -- cloud analog of pytests/storage/fusion/
# fusion_log_corruption.py's on-prem test_fusion_log_corruption_during_extent_migration.
# Freezes migration, corrupts files found under whatever path(s) CBS's own
# GET /fusion/activeGuestVolumes reports for each KV node (NOT `mount | grep guest<N>`
# -- a first run found no such mount at all despite guest volumes genuinely being
# attached and migrating; see _discover_guest_volume_mounts_via_mount's docstring),
# then reads every loaded document and records whether corruption was detected and
# whether it triggered any node-health reaction. See the module/test docstring for the
# two genuinely unconfirmed mechanisms still stacked here (junk-byte corruption's effect
# on fusion's actual log format, ep_data_read_failed over cbstats-via-SSM) -- only
# "activeGuestVolumes resolved to at least one real file" and "files were corrupted" are
# hard pass/fail gates; the corruption-detected/node-health-reaction outcome is recorded
# as a finding, not asserted.
#   corrupt_files_per_node=3           how many files to corrupt per guest-volume path
#   corrupt_read_workload_timeout=3600  bound on the post-corruption read workload before
#                                        force-stopping it (a read against corrupted data
#                                        can stall per-key instead of failing fast)
#
# test_delete_log_files_from_guest_volumes_after_attachment automates COVERAGE.md §9's
# "Delete log files from guest volumes after attachment" row -- sibling of
# test_corrupt_log_files_on_guest_volumes (same discovery/read-workload/outcome machinery,
# both call the shared _run_guest_volume_log_tamper_test driver), except the tamper action
# unlinks the file outright instead of appending junk bytes. Built because the corrupt
# variant's first real run corrupted 9 files but observed ZERO read/migration failures --
# plausibly because the original, still-valid content survives a trailing append; deleting
# the file removes that fallback entirely, so this is expected to be a strictly more
# aggressive fault. Same posture as the corrupt variant: only "a file was found" and "files
# were actually deleted" are hard gates, the detected/node-health-reaction outcome is
# recorded as a finding. Also monitors GET /fusion/activeGuestVolumes for
# active_guest_volume_monitor_duration seconds right after resuming migration
# (purely observational -- see _monitor_active_guest_volumes), unlike the corrupt
# sibling above, which does not opt into that.
#   delete_files_per_node=3            how many files to delete per guest-volume path
#   delete_read_workload_timeout=3600  bound on the post-delete read workload before
#                                       force-stopping it
#   active_guest_volume_monitor_duration=1800 how long to poll activeGuestVolumes after
#                                              resuming migration -- stops early once the
#                                              total reaches 0, so this is just an upper
#                                              bound; a real run found the count stuck
#                                              nonzero for the ENTIRE default 300s window
#                                              with no sign of draining, hence the higher
#                                              default
#   active_guest_volume_monitor_interval=20   seconds between polls
#
# test_delete_log_files_from_guest_volumes_during_download automates COVERAGE.md §9's
# "Delete log files from guest volumes during download" row -- an EARLIER boundary than
# the after-attachment sibling above: targets an accelerator's OWN local copy of the S3
# log store while still in Phase 5, before Phase 6 hands the volume to a KV node and
# before CBS has any visibility into it via /fusion/activeGuestVolumes (that endpoint
# only exists once the CP's Phase 7 rebalance call tells CBS the volume exists). Reuses
# _find_downloading_accelerator (same helper test_dp_accelerator_crash_during_download
# and test_restart_accelerator_node_mid_download already use) to land on a target caught
# mid-download, and the same single-value fusion_download_rate_limit lesson applies. The
# accelerator-side file layout is NOT confirmed the way the KV-node side now is --
# discovered via a broad `find` for the same kv/<uuid>/kvstore-<N>/log-<X>.<Y> pattern
# rather than a known mount path. Only "a downloading accelerator was found" and "files
# were deleted" are hard gates; the detection outcome (rebalance failure, accelerator
# redeploy, eventual migration/read failures) is recorded as a finding.
#   delete_files_per_node=3                        how many files to delete on the target
#   delete_during_download_recovery_timeout=1800   how long to wait for the rebalance to
#                                                   resolve (healthy or failed) after the
#                                                   delete before concluding it is stuck
#   active_guest_volume_monitor_duration=1800      how long to poll activeGuestVolumes
#                                                   after resuming migration. A real run
#                                                   (jenkins_output7.log) found the count
#                                                   stuck nonzero (15, all on one node)
#                                                   for the entire prior 300s default with
#                                                   no sign of draining, so this needs to
#                                                   be generous; the poll loop now exits
#                                                   early once the count reaches 0, so a
#                                                   faster-draining run won't wait it out
#   active_guest_volume_monitor_interval=20        seconds between polls
#
# test_crash_memcached_during_s3_upload automates COVERAGE.md §10's "Crash memcached
# during S3 upload" row -- redesigned to land the kill RELIABLY rather than estimate its
# timing from the clock: loads a large backlog with fusion DISABLED, enables fusion (a
# large unsynced backlog forces a real, observable "enabling" backfill state distinct
# from "enabled" -- direct prior art: fusion_enable_disable_test.py's
# test_kill_memcached_during_enable_cp_retries), kills memcached CLUSTER-WIDE repeatedly
# while still "enabling" (not just once), waits for fusion to reach "enabled" and the
# backlog to actually finish syncing (pending bytes -> 0 AND S3 objects present -- the
# latter is the hard gate), then goes on to trigger a normal fusion rebalance on the same
# cluster (something the sibling test in fusion_enable_disable_test.py cannot do --
# FusionEnableDisableTests has no _trigger_rebalance). create_end defaults large
# (50,000,000) so there is a real backlog/window for the CP to visibly work through.
#   enabling_state_search_timeout=120  how long to poll for fusion to show 'enabling'
#                                       after calling enable_fusion, before giving up
#   enable_kill_count=3                how many times to kill+confirm-restart memcached
#                                       (cluster-wide) while still 'enabling'
#   enable_kill_settle_secs=20         wait after each kill attempt before checking
#                                       whether to kill again
#   memcached_restart_timeout=300      how long to wait for ns_server to bring memcached
#                                       back up after each kill attempt
#   sync_wait_timeout=1800             bound on waiting for pending bytes -> 0 and S3
#                                       objects to appear once fusion reports 'enabled'
#
# Execution:
#   python testrunner.py -i node.ini \
#       -c conf/fusion/cloud/fusion_cp_resiliency_test.conf \
#       -p aws_access_key=$AWS_ACCESS_KEY_ID,aws_secret_key=$AWS_SECRET_ACCESS_KEY


