# Fusion Accelerator Lifecycle — Cloud (Capella) Tests
#
# Validates fusion accelerator EC2 instances and EBS guest volumes across
# Couchbase rebalances on AWS-backed Capella clusters (§2, §7 of the E2E
# Capella Integration Test Plan).
#
# Required: -p aws_access_key=<key>,aws_secret_key=<secret>
#
# create_end is PER COLLECTION and these buckets get 2 collections, so
# create_end=25000000 => 50M items, ~48 GiB logical, ~96 GiB stored,
# ~32 GiB per host at kv_nodes=3. That is below the CP default
# fusion_min_split_size_gb=50, which would otherwise collapse every test to a
# single shard/host, so every line below now sets fusion_min_split_size_gb=10
# (~3-4 shards/host) to keep exercising fleet behaviour (multiple
# accelerators/ASGs/guest volumes). At the fusion_migration_rate_limit=78643200
# (75 MB/s) resume rate, the handoff/migration window for the stage-observation
# tests (16, 17, 19 and their lettered variants) still runs several minutes at
# this size — enough for the stage pollers to sample it.
#
# test_guest_volume_size_scales_with_data (test 9) is the one exception: it
# runs at half its original scale — create_end=100000000 (~127 GiB/host) /
# small_create_end=50000000 (~63.5 GiB/host) — because it needs >45 GB of
# per-host data to clear the 50 GB volume-size floor, which the file-wide
# 25000000/32 GiB scale cannot provide (same reason the lowdata conf omits
# this test entirely).
#
# For an even smaller/faster smoke run (~19 GiB/host) use
# fusion_accelerator_lifecycle_lowdata_test.conf.
#
# Key params:
#   fusion_threshold_gib=2        applied as enableSyncThresholdMB; decides
#                                  fusion vs DCP path. Unset => likely DCP.
#   fusion_min_split_size_gb=<GB>  CP default 50. Lower => more shards/volumes
#                                  and a lower volume-size floor.
#   fusion_max_slots=<N>           CP default 22. Lower => fewer, bigger volumes.
#   fusion_migration_rate_limit=0  freeze background migration so guest volumes
#                                  survive long enough to inspect; 78643200
#                                  (75 MB/s) is the value to resume at. Tests
#                                  16-18 freeze best-effort; 20 requires it.
#   fusion_upload_interval=600     uploader flush interval; load waits this long
#                                  so the rebalance plans against a full log store.
#   fusion_upload_settle=120       extra wait after the load ends.
#   expected_iops=16000            download IOPS; scaled_iops=3000 is the
#                                  post-handoff value (informational — the
#                                  assertion is only that IOPS dropped).
#   scaled_iops_grace=120          extra Stage C watch for the async scale-down.
#   transfer_poll_interval=5       Stage C sample cadence.
#   soft_fail_stages=True          report all stage failures together (default).
#   fleet_stable_samples=3         stable 10s polls before Stage A assertions.
#
# rebalance_type (optional, suite-wide): in (default, scale-out) | out (needs
# kv_nodes>=4) | swap (needs swap_compute=<same-family instance type>).
#
# Execution:
#   python testrunner.py -i node.ini \
#       -c conf/fusion/cloud/fusion_accelerator_lifecycle_test.conf \
#       -p aws_access_key=$AWS_ACCESS_KEY_ID,aws_secret_key=$AWS_SECRET_ACCESS_KEY


aGoodDoctor.fusion.fusion_accelerator_lifecycle_test.FusionAcceleratorLifecycleTest:

    # 1: accelerator + ASG deployment and instance-type validation (phase 4)
    test_accelerator_deployment,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,GROUP=accelerator_P0

    # 2: accelerators and ASGs torn down after rebalance (phase 8)
    test_accelerator_termination_after_rebalance,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,GROUP=accelerator_P0

    # 3: full EBS guest volume lifecycle — created, hydrated, then count=0
    test_ebs_guest_volume_full_lifecycle,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,GROUP=accelerator_P0

    # 4: back-to-back rebalances leave no orphaned EBS guest volumes
    test_back_to_back_rebalances_no_orphaned_volumes,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,GROUP=accelerator_P0

    # 5 (fusion state stays 'enabled') runs as a background watcher inside
    # test_fusion_scaling_lifecycle.

    # 6: accelerator count scales with data size (0 below threshold, >=1 above);
    # drives two rebalances
    test_accelerator_instance_count_matches_data_size,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,small_create_end=100,expected_accelerator_count=1,GROUP=accelerator_P0

    # 7: accelerator EC2 nodes must have no public IP
    test_no_public_ip_on_accelerator_nodes,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,GROUP=accelerator_P0

    # 8: guest volume storage class, IOPS, throughput, encryption, tags, AZ colocation
    test_guest_volume_properties,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,expected_iops=16000,expected_throughput=2000,GROUP=accelerator_P0

    # 9: guest volume provisioning scales with data size across two loads.
    # fusion_max_slots=1 pins one shard per host so per-volume SIZE is the scaling
    # dimension; small_create_end must put >45 GB per host to clear the 50 GB floor.
    test_guest_volume_size_scales_with_data,create_end=100000000,doc_size=2048,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,small_create_end=50000000,fusion_max_slots=1,fusion_min_split_size_gb=10,gv_launch_timeout=1800,rebalance_timeout=3600,GROUP=accelerator_P0

    # 10: all accelerator ASGs deleted within 5 minutes of rebalance completion
    test_asg_deleted_after_rebalance_within_5_mins,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,GROUP=accelerator_P0

    # 11 (terminate accelerator mid-rebalance) moved to fusion_accelerator_chaos_test.py.
    # 12 (instance type validation) runs inside test_accelerator_deployment.

    # 13: one ASG per accelerator, DesiredCapacity == 1, one InService instance
    test_asg_desired_capacity_one_per_shard,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,GROUP=accelerator_P0

    # 14: every accelerator EBS volume is >= 50 GB at 16000 IOPS
    test_accelerator_ebs_volume_min_size,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,expected_iops=16000,GROUP=accelerator_P0

    # 15 (CloudWatch download-progress monitoring) removed.

    # 16: Stage C handoff — accelerators gone, volumes on KV nodes, IOPS drops,
    # API + reads. Freezes migration across the rebalance, resumes after the check.
    test_guest_volume_transfer_to_cluster,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,scaled_iops=3000,scaled_iops_grace=120,read_workload_items=20000,transfer_poll_interval=5,fusion_migration_rate_limit=78643200,GROUP=accelerator_P0

    # 17: Stage E — migration stats climb, guest-volume API drains N -> 0, main-volume
    # du rises. Resumes migration right before monitoring so the copy starts at a
    # known instant from the full set of volumes.
    test_background_migration_progress,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,fusion_migration_rate_limit=78643200,GROUP=accelerator_P0

    # 18: Stage F — EBS+ASG deleted, no orphans, no migration failures, cluster
    # healthy, S3 intact, reads work. Freezes migration first so the "none remains"
    # assertions cannot pass vacuously.
    test_teardown_after_rebalance,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,read_workload_items=20000,fusion_migration_rate_limit=78643200,GROUP=accelerator_P0

    # 19: end-to-end — every Stage A -> F validation on a SINGLE rebalance.
    # A (fleet) -> B (capture volume IDs + disk baseline) -> rebalance -> C (handoff)
    # -> E (drain to 0, main volume du rises) -> F (teardown).
    test_fusion_scaling_lifecycle,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,expected_iops=16000,scaled_iops=3000,read_workload_items=20000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1200,hydration_timeout=1800,rebalance_timeout=3600,GROUP=accelerator_P0

    # 20: two rebalances with migration FROZEN so guest volumes accumulate, then
    # resume and require the whole backlog plus all fusion infra to be destroyed.
    # Counterpart to test 4. hydration_timeout must cover both rebalances' backlog.
    test_guest_volume_accumulation_with_migration_paused,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,read_workload_items=20000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1200,hydration_timeout=2400,rebalance_timeout=3600,fusion_migration_rate_limit=78643200,GROUP=accelerator_P0

    # 21: every temporary resource (accelerator instances, ASGs, guest volumes, S3
    # log-store bucket, IAM instance profile/role) carries couchbase-cloud-cluster-id
    # and couchbase-cloud-function=fusion-accelerator tags
    test_accelerator_resource_tags,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,GROUP=accelerator_P0


# ======================================================================================
# Shard-sizing variations — re-runs of the above under moved
# fusion_min_split_size_gb / fusion_max_slots. Each line is a full load + rebalance,
# so enable them deliberately. Grid at create_end=25000000, kv_nodes=3, replicas=1
# (~32 GiB per host):
#
#   minSplit  maxSlots  shards/host  vol GiB  cap binds?  exercises
#   50 (def)  22 (def)       1         50         no      CP-default reference only —
#                                                         no test line uses bare
#                                                         defaults at this size
#   10        22 (def)       4          8         no      baseline (entries above)
#   10         2             2         16        YES      slot cap binds, bigger volumes
#   50 (def)   1             1         50         no      one volume per host (16a) —
#                                                         maxSlots=1 no longer binds
#                                                         anything (default already
#                                                         gives 1 shard at this size)
#    2        22 (def)      16         2         no      20b's intended "slot
#                                                         saturation": at 127 GiB/host
#                                                         this saturated the 22-slot
#                                                         cap; at 32 GiB/host it no
#                                                         longer does (16 < 22) — lower
#                                                         fusion_min_split_size_gb (e.g.
#                                                         1, as 20d already uses) if you
#                                                         want true saturation back
# ======================================================================================

    # 1a: many small shards — multi-accelerator fleet
    test_accelerator_deployment,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,GROUP=accelerator_P1

    # 1b: slot cap binds — few oversized volumes
    test_accelerator_deployment,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,fusion_max_slots=2,GROUP=accelerator_P1

    # 13a: ASG-per-shard parity when there are many shards
    test_asg_desired_capacity_one_per_shard,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,GROUP=accelerator_P1

    # 14a: volume size floor tracks a lowered minSplitSize (>= 10 GB, not 50)
    test_accelerator_ebs_volume_min_size,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,expected_iops=16000,GROUP=accelerator_P1

    # 14b: oversized volumes from a bound slot cap
    test_accelerator_ebs_volume_min_size,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,fusion_max_slots=2,expected_iops=16000,GROUP=accelerator_P1

    # 16a: handoff of one big volume per host — degenerate single-shard case
    test_guest_volume_transfer_to_cluster,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_max_slots=1,scaled_iops=3000,scaled_iops_grace=120,read_workload_items=20000,transfer_poll_interval=5,fusion_migration_rate_limit=78643200,GROUP=accelerator_P1

    # 16b: handoff of many small volumes — per-shard latching across a wide fleet
    test_guest_volume_transfer_to_cluster,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,scaled_iops=3000,scaled_iops_grace=120,read_workload_items=20000,transfer_poll_interval=5,fusion_migration_rate_limit=78643200,GROUP=accelerator_P1

    # 19a: full lifecycle with many small shards
    test_fusion_scaling_lifecycle,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,expected_iops=16000,scaled_iops=3000,read_workload_items=20000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1200,hydration_timeout=1800,rebalance_timeout=3600,GROUP=accelerator_P1

    # 20a: accumulation with many small shards — a large backlog to reclaim
    test_guest_volume_accumulation_with_migration_paused,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,read_workload_items=20000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1200,hydration_timeout=2400,rebalance_timeout=3600,fusion_migration_rate_limit=78643200,GROUP=accelerator_P1

    # 20b: slot saturation — 22 volumes per node, ~44 accumulated across two
    # rebalances. Most likely line to surface CP or per-node EBS device limits.
    test_guest_volume_accumulation_with_migration_paused,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=2,fusion_max_slots=22,read_workload_items=20000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1200,hydration_timeout=3000,rebalance_timeout=3600,fusion_migration_rate_limit=78643200,GROUP=accelerator_P1


# ======================================================================================
# Rebalance-type variations — scale-IN and SWAP re-runs of the entries above.
#
#   rebalance_type=out   requires kv_nodes >= 4; the suite refuses to drop below 3
#                        data nodes (_MIN_KV_NODES).
#   rebalance_type=swap  requires swap_compute — AWS.compute has no c7g entries so
#                        _alt_compute() cannot derive one for c7g.4xlarge.
#                        c7g.8xlarge is used below; verify it is allowed in your project.
#
# Multi-rebalance tests (4, 6, 20) pair each run with its inverse, so 'out' means
# out-then-in. kv_nodes=4 spreads the same data thinner (~24 GiB/host); with
# fusion_min_split_size_gb=10 that is still ceil(24/10)=3 shards/host.
# ======================================================================================

    # 1c: scale-IN — do accelerators launch when a node is removed?
    test_accelerator_deployment,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=4,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,rebalance_type=out,GROUP=accelerator_P2

    # 1d: SWAP — same node count, different compute
    test_accelerator_deployment,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,rebalance_type=swap,swap_compute=c7g.8xlarge,GROUP=accelerator_P0

    # 1e: multi-node scale-out — two nodes added in one rebalance (3 -> 5)
    test_accelerator_deployment,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,rebalance_delta=2,GROUP=accelerator_P2

    # 2a: cleanup after a scale-IN
    test_accelerator_termination_after_rebalance,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=4,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,rebalance_type=out,GROUP=accelerator_P2

    # 4a: back-to-back starting with the removal — out-then-in
    test_back_to_back_rebalances_no_orphaned_volumes,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=4,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,rebalance_type=out,GROUP=accelerator_P2

    # 16c: handoff on a scale-IN — where do guest volumes land when a node is leaving?
    test_guest_volume_transfer_to_cluster,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=4,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,rebalance_type=out,scaled_iops=3000,scaled_iops_grace=120,read_workload_items=20000,transfer_poll_interval=5,fusion_migration_rate_limit=78643200,GROUP=accelerator_P2

    # 16d: handoff on a SWAP — volumes must land on the replacement nodes
    test_guest_volume_transfer_to_cluster,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,rebalance_type=swap,swap_compute=c7g.8xlarge,scaled_iops=3000,scaled_iops_grace=120,read_workload_items=20000,transfer_poll_interval=5,fusion_migration_rate_limit=78643200,GROUP=accelerator_P2

    # 17a: migration drain after a scale-IN
    test_background_migration_progress,create_end=25000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=4,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=10,rebalance_type=out,fusion_migration_rate_limit=78643200,GROUP=accelerator_P2

    # 18a: teardown after a SWAP — nothing left behind on the replaced nodes
