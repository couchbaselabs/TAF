# Fusion Accelerator Lifecycle — Cloud (Capella) Tests
#
# Validates fusion accelerator EC2 instances and EBS guest volumes across
# Couchbase rebalances on AWS-backed Capella clusters (§2, §7 of the E2E
# Capella Integration Test Plan).
#
# Required: -p aws_access_key=<key>,aws_secret_key=<secret>
#
# create_end is PER COLLECTION and these buckets get 2 collections, so
# create_end=100000000 => 200M items, ~191 GiB logical, ~381 GiB stored,
# ~127 GiB per host at kv_nodes=3. Do not shrink it for the stage-observation
# tests (16, 17, 19) — the handoff/migration windows must last minutes or the
# stage pollers cannot sample them. For a fast smoke run on ~19 GiB use
# fusion_accelerator_lifecycle_lowdata_test.conf.
#
# Key params:
#   fusion_threshold_gib=10        applied as enableSyncThresholdMB; decides
#                                  fusion vs DCP path. Unset => likely DCP.
#   fusion_min_split_size_gb=<GB>  CP default 50. Lower => more shards/volumes
#                                  and a lower volume-size floor.
#   fusion_max_slots=<N>           CP default 22. Lower => fewer, bigger volumes.
#   fusion_migration_rate_limit=0  freeze background migration so guest volumes
#                                  survive long enough to inspect; 78643200
#                                  (75 MB/s) is the value to resume at. Tests
#                                  16-18 freeze best-effort; 20 requires it.
#   fusion_upload_interval=600     uploader flush interval; load waits this long
#                                  so the rebalance plans against a full log store.
#   fusion_upload_settle=120       extra wait after the load ends.
#   expected_iops=16000            download IOPS; scaled_iops=3000 is the
#                                  post-handoff value (informational — the
#                                  assertion is only that IOPS dropped).
#   scaled_iops_grace=120          extra Stage C watch for the async scale-down.
#   transfer_poll_interval=5       Stage C sample cadence.
#   soft_fail_stages=True          report all stage failures together (default).
#   fleet_stable_samples=3         stable 10s polls before Stage A assertions.
#
# rebalance_type (optional, suite-wide): in (default, scale-out) | out (needs
# kv_nodes>=4) | swap (needs swap_compute=<same-family instance type>).
#
# Execution:
#   python testrunner.py -i node.ini \
#       -c conf/fusion/cloud/fusion_accelerator_lifecycle_test.conf \
#       -p aws_access_key=$AWS_ACCESS_KEY_ID,aws_secret_key=$AWS_SECRET_ACCESS_KEY


aGoodDoctor.fusion.fusion_accelerator_lifecycle_test.FusionAcceleratorLifecycleTest:

    # 1: accelerator + ASG deployment and instance-type validation (phase 4)
    test_accelerator_deployment,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=accelerator_deployment

    # 2: accelerators and ASGs torn down after rebalance (phase 8)
    test_accelerator_termination_after_rebalance,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=accelerator_termination

    # 3: full EBS guest volume lifecycle — created, hydrated, then count=0
    test_ebs_guest_volume_full_lifecycle,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=guest_volume_lifecycle

    # 4: back-to-back rebalances leave no orphaned EBS guest volumes
    test_back_to_back_rebalances_no_orphaned_volumes,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=back_to_back_rebalances

    # 5 (fusion state stays 'enabled') runs as a background watcher inside
    # test_fusion_scaling_lifecycle.

    # 6: accelerator count scales with data size (0 below threshold, >=1 above);
    # drives two rebalances
    test_accelerator_instance_count_matches_data_size,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,small_create_end=100,expected_accelerator_count=1,GROUP=accelerator_count_scaling

    # 7: accelerator EC2 nodes must have no public IP
    test_no_public_ip_on_accelerator_nodes,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=accelerator_network

    # 8: guest volume storage class, IOPS, throughput, encryption, tags, AZ colocation
    test_guest_volume_properties,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,expected_iops=16000,expected_throughput=2000,GROUP=guest_volume_properties

    # 9: guest volume provisioning scales with data size across two loads.
    # fusion_max_slots=1 pins one shard per host so per-volume SIZE is the scaling
    # dimension; small_create_end must put >45 GB per host to clear the 50 GB floor.
    test_guest_volume_size_scales_with_data,create_end=200000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,small_create_end=100000000,fusion_max_slots=1,gv_launch_timeout=1800,rebalance_timeout=3600,GROUP=guest_volume_size_scaling

    # 10: all accelerator ASGs deleted within 5 minutes of rebalance completion
    test_asg_deleted_after_rebalance_within_5_mins,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=asg_cleanup

    # 11 (terminate accelerator mid-rebalance) moved to fusion_accelerator_chaos_test.py.
    # 12 (instance type validation) runs inside test_accelerator_deployment.

    # 13: one ASG per accelerator, DesiredCapacity == 1, one InService instance
    test_asg_desired_capacity_one_per_shard,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=asg_capacity

    # 14: every accelerator EBS volume is >= 50 GB at 16000 IOPS
    test_accelerator_ebs_volume_min_size,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,min_volume_size_gb=50,expected_iops=16000,GROUP=ebs_volume_sizing

    # 15 (CloudWatch download-progress monitoring) removed.

    # 16: Stage C handoff — accelerators gone, volumes on KV nodes, IOPS drops,
    # API + reads. Freezes migration across the rebalance, resumes after the check.
    test_guest_volume_transfer_to_cluster,create_end=200000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,scaled_iops=3000,scaled_iops_grace=120,read_workload_items=100000,transfer_poll_interval=5,fusion_migration_rate_limit=78643200,GROUP=guest_volume_transfer

    # 17: Stage E — migration stats climb, guest-volume API drains N -> 0, main-volume
    # du rises. Resumes migration right before monitoring so the copy starts at a
    # known instant from the full set of volumes.
    test_background_migration_progress,create_end=200000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,fusion_migration_rate_limit=78643200,GROUP=migration_progress

    # 18: Stage F — EBS+ASG deleted, no orphans, no migration failures, cluster
    # healthy, S3 intact, reads work. Freezes migration first so the "none remains"
    # assertions cannot pass vacuously.
    test_teardown_after_rebalance,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,read_workload_items=100000,fusion_migration_rate_limit=78643200,GROUP=fusion_teardown

    # 19: end-to-end — every Stage A -> F validation on a SINGLE rebalance.
    # A (fleet) -> B (capture volume IDs + disk baseline) -> rebalance -> C (handoff)
    # -> E (drain to 0, main volume du rises) -> F (teardown).
    test_fusion_scaling_lifecycle,create_end=200000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,expected_iops=16000,scaled_iops=3000,read_workload_items=100000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1800,hydration_timeout=3600,rebalance_timeout=3600,GROUP=scaling_lifecycle_e2e

    # 20: two rebalances with migration FROZEN so guest volumes accumulate, then
    # resume and require the whole backlog plus all fusion infra to be destroyed.
    # Counterpart to test 4. hydration_timeout must cover both rebalances' backlog.
    test_guest_volume_accumulation_with_migration_paused,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,read_workload_items=100000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1800,hydration_timeout=5400,rebalance_timeout=3600,fusion_migration_rate_limit=78643200,GROUP=guest_volume_accumulation


# ======================================================================================
# Shard-sizing variations — re-runs of the above under moved
# fusion_min_split_size_gb / fusion_max_slots. Each line is a full load + rebalance,
# so enable them deliberately. Grid at create_end=100000000, kv_nodes=3, replicas=1
# (~127 GiB per host):
#
#   minSplit  maxSlots  shards/host  vol GiB  cap binds?  exercises
#   50 (def)  22 (def)       3         50         no      baseline (entries above)
#   10        22 (def)      13         11         no      many small volumes
#   10         2             2         70        YES      slot cap binds, bigger volumes
#   50 (def)   1             1        140        YES      one volume per host
#    2        22 (def)      22          7        YES      slot saturation; 2 GB may be
#                                                         below the CP minimum — the
#                                                         config read-back will say so
#
# create_end=200000000 lines double these per-host figures (~254 GiB/host); check
# against disk=200 before running them.
# ======================================================================================

    # 1a: many small shards — multi-accelerator fleet
    test_accelerator_deployment,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,fusion_min_split_size_gb=10,GROUP=accelerator_deployment

    # 1b: slot cap binds — few oversized volumes
    test_accelerator_deployment,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,fusion_min_split_size_gb=10,fusion_max_slots=2,GROUP=accelerator_deployment

    # 13a: ASG-per-shard parity when there are many shards
    test_asg_desired_capacity_one_per_shard,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,fusion_min_split_size_gb=10,GROUP=asg_capacity

    # 14a: volume size floor tracks a lowered minSplitSize (>= 10 GB, not 50)
    test_accelerator_ebs_volume_min_size,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,fusion_min_split_size_gb=10,expected_iops=16000,GROUP=ebs_volume_sizing

    # 14b: oversized volumes from a bound slot cap
    test_accelerator_ebs_volume_min_size,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,fusion_min_split_size_gb=10,fusion_max_slots=2,expected_iops=16000,GROUP=ebs_volume_sizing

    # 16a: handoff of one big volume per host — degenerate single-shard case
    test_guest_volume_transfer_to_cluster,create_end=200000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,fusion_max_slots=1,scaled_iops=3000,scaled_iops_grace=120,read_workload_items=100000,transfer_poll_interval=5,fusion_migration_rate_limit=78643200,GROUP=guest_volume_transfer

    # 16b: handoff of many small volumes — per-shard latching across a wide fleet
    test_guest_volume_transfer_to_cluster,create_end=200000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,fusion_min_split_size_gb=10,scaled_iops=3000,scaled_iops_grace=120,read_workload_items=100000,transfer_poll_interval=5,fusion_migration_rate_limit=78643200,GROUP=guest_volume_transfer

    # 19a: full lifecycle with many small shards
    test_fusion_scaling_lifecycle,create_end=200000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,fusion_min_split_size_gb=10,expected_iops=16000,scaled_iops=3000,read_workload_items=100000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1800,hydration_timeout=3600,rebalance_timeout=3600,GROUP=scaling_lifecycle_e2e

    # 20a: accumulation with many small shards — a large backlog to reclaim
    test_guest_volume_accumulation_with_migration_paused,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,fusion_min_split_size_gb=10,read_workload_items=100000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1800,hydration_timeout=5400,rebalance_timeout=3600,fusion_migration_rate_limit=78643200,GROUP=guest_volume_accumulation

    # 20b: slot saturation — 22 volumes per node, ~44 accumulated across two
    # rebalances. Most likely line to surface CP or per-node EBS device limits.
    test_guest_volume_accumulation_with_migration_paused,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,fusion_min_split_size_gb=2,fusion_max_slots=22,read_workload_items=100000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1800,hydration_timeout=7200,rebalance_timeout=3600,fusion_migration_rate_limit=78643200,GROUP=guest_volume_accumulation


# ======================================================================================
# Rebalance-type variations — scale-IN and SWAP re-runs of the entries above.
#
#   rebalance_type=out   requires kv_nodes >= 4; the suite refuses to drop below 3
#                        data nodes (_MIN_KV_NODES).
#   rebalance_type=swap  requires swap_compute — AWS.compute has no c7g entries so
#                        _alt_compute() cannot derive one for c7g.4xlarge.
#                        c7g.8xlarge is used below; verify it is allowed in your project.
#
# Multi-rebalance tests (4, 6, 20) pair each run with its inverse, so 'out' means
# out-then-in. kv_nodes=4 spreads the same data thinner (~48 GiB/host), producing
# fewer shards per host unless minSplitSize is also lowered.
# ======================================================================================

    # 1c: scale-IN — do accelerators launch when a node is removed?
    test_accelerator_deployment,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=4,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,rebalance_type=out,GROUP=accelerator_deployment

    # 1d: SWAP — same node count, different compute
    test_accelerator_deployment,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,rebalance_type=swap,swap_compute=c7g.8xlarge,GROUP=accelerator_deployment

    # 1e: multi-node scale-out — two nodes added in one rebalance (3 -> 5)
    test_accelerator_deployment,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,rebalance_delta=2,GROUP=accelerator_deployment

    # 2a: cleanup after a scale-IN
    test_accelerator_termination_after_rebalance,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=4,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,rebalance_type=out,GROUP=accelerator_termination

    # 4a: back-to-back starting with the removal — out-then-in
    test_back_to_back_rebalances_no_orphaned_volumes,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=4,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,rebalance_type=out,GROUP=back_to_back_rebalances

    # 16c: handoff on a scale-IN — where do guest volumes land when a node is leaving?
    test_guest_volume_transfer_to_cluster,create_end=200000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=4,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,rebalance_type=out,scaled_iops=3000,scaled_iops_grace=120,read_workload_items=100000,transfer_poll_interval=5,fusion_migration_rate_limit=78643200,GROUP=guest_volume_transfer

    # 16d: handoff on a SWAP — volumes must land on the replacement nodes
    test_guest_volume_transfer_to_cluster,create_end=200000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,rebalance_type=swap,swap_compute=c7g.8xlarge,scaled_iops=3000,scaled_iops_grace=120,read_workload_items=100000,transfer_poll_interval=5,fusion_migration_rate_limit=78643200,GROUP=guest_volume_transfer

    # 17a: migration drain after a scale-IN
    test_background_migration_progress,create_end=200000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=4,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,rebalance_type=out,fusion_migration_rate_limit=78643200,GROUP=migration_progress

    # 18a: teardown after a SWAP — nothing left behind on the replaced nodes
    test_teardown_after_rebalance,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,rebalance_type=swap,swap_compute=c7g.8xlarge,read_workload_items=100000,fusion_migration_rate_limit=78643200,GROUP=fusion_teardown

    # 19b: full lifecycle under a scale-IN
    test_fusion_scaling_lifecycle,create_end=200000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=4,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,rebalance_type=out,expected_iops=16000,scaled_iops=3000,read_workload_items=100000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1800,hydration_timeout=3600,rebalance_timeout=3600,GROUP=scaling_lifecycle_e2e

    # 19c: full lifecycle under a SWAP
    test_fusion_scaling_lifecycle,create_end=200000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,rebalance_type=swap,swap_compute=c7g.8xlarge,expected_iops=16000,scaled_iops=3000,read_workload_items=100000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1800,hydration_timeout=3600,rebalance_timeout=3600,GROUP=scaling_lifecycle_e2e

    # 20c: accumulation starting with the removal — out-then-in with migration frozen
    test_guest_volume_accumulation_with_migration_paused,create_end=100000000,doc_size=1024,replicas=1,num_buckets=1,kv_nodes=4,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=1200,fusion_threshold_gib=10,rebalance_type=out,fusion_min_split_size_gb=10,read_workload_items=100000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1800,hydration_timeout=5400,rebalance_timeout=3600,fusion_migration_rate_limit=78643200,GROUP=guest_volume_accumulation
