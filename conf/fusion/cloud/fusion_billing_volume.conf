# Fusion Billing Volume Test — CP database billing verification
#
# Verifies that the correct PagerTask billing entries are written to the
# Control Plane Couchbase database after every fusion rebalance.
#
# Required runtime parameters (pass via -p):
#   aws_access_key=<key>
#   aws_secret_key=<secret>
#   cp_eks_cluster_name=<name>   CP EKS cluster name, e.g. "qe-7-cp-eks", "sbx-10-cp-eks"
#   cp_role_arn=<arn>            IAM role to assume for CP cluster access (e.g. jenkins-cp-cli)
#
# Optional CP k8s connection parameters:
#   cp_external_id=<id>          External ID required by the role's trust policy, if any
#   cp_namespace=<ns>            k8s namespace where CP Couchbase runs
#
# CP Couchbase credentials are never passed as test params — KubectlCPDBUtil
# reads them off the pod's Datadog Autodiscovery annotation once connected.
#
# What is verified after every rebalance:
#   1. billing.pagerTask: one document per completed accelerator node
#   2. fusionDetails.shardSizeInBytes >= 0
#   3. fusionDetails.downloadCompletedAt non-zero and after registeredAt
#   4. usageCategory = "Fusion 2"
#   5. No duplicate nodeIDs (idempotency check)
#   6. META.expiration (TTL) is set on each PagerTask document
#
# After every rebalance, a minimum inter_rebalance_wait_secs gap (default
# 600s) is enforced before the next rebalance starts, and the billing.variable
# record of every prior rebalance in the run is re-fetched fresh from the CP
# database and logged, to catch a later rebalance overwriting an earlier
# one's variable cost record.
#
# Execution:
#   python testrunner.py -i node.ini \
#       -c conf/fusion/cloud/fusion_billing_volume.conf \
#       -p aws_access_key=$AWS_ACCESS_KEY_ID,aws_secret_key=$AWS_SECRET_ACCESS_KEY \
#       -p cp_eks_cluster_name=qe-7-cp-eks,cp_role_arn=<jenkins-cp-cli-role-arn> \
#       -p region=us-east-1,h_scaling=True,iterations=3


aGoodDoctor.fusion.fusion_billing_volume.FusionBillingVolumeTest:

    # Horizontal scale up/down with billing verification after each rebalance
    # iterations=3 → 3 scale-up steps (3→5→7→8 nodes) + 3 scale-down steps
    test_billing_volume,num_items=15000000,doc_size=1024,replicas=1,num_buckets=1,region=us-east-1,sdk_timeout=60,index_timeout=7200,h_scaling=True,iterations=3,rebl_steps=3-5-7-8,cycles=1,billing_verification=True
