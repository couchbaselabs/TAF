aGoodDoctor.fusion.fusion_backup_restore.FusionBackupRestore:

    # Fusion backup/restore matrix (TC1-TC22 + self-cluster), Capella cloud.
    # Three subcomponents = GROUP names; run one via -p GROUP=<name>:
    #   backup_restore_source_without_guest_volumes  (30M)  disabled / no-GV source
    #   backup_restore_source_with_guest_volumes     (100M) GV source (+ self-cluster)
    #   backup_restore_cross_region                  (30M)  CR + CRB cases
    # Per-test tags (tcN / crN / crbN / self_cluster) select a single case.
    # Guest-volume restores are validated by data integrity, not GV presence.

    # TC1: disabled source -> disabled target
    test_disabled_source_to_disabled_target,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_source_without_guest_volumes;tc1

    # TC2: disabled source -> enabled target (no target guest volumes)
    test_disabled_source_to_enabled_target_without_guest_volumes,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_source_without_guest_volumes;tc2

    # TC3: disabled source -> enabled target (target has guest volumes)
    test_disabled_source_to_enabled_target_with_guest_volumes,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_source_without_guest_volumes;tc3

    # TC10: disabled source -> target restored while enabling
    test_disabled_source_to_target_while_enabling,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_source_without_guest_volumes;tc10

    # TC12: disabled source -> target restored while disabling (no target guest volumes)
    test_disabled_source_to_target_while_disabling_without_guest_volumes,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_source_without_guest_volumes;tc12

    # TC14: disabled source -> target restored while disabling (target has guest volumes)
    test_disabled_source_to_target_while_disabling_with_guest_volumes,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_source_without_guest_volumes;tc14

    # TC4: enabled source (no guest volumes) -> disabled target
    test_enabled_source_without_guest_volumes_to_disabled_target,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_source_without_guest_volumes;tc4

    # TC5: enabled source (no guest volumes) -> enabled target (no target guest volumes)
    test_enabled_source_without_guest_volumes_to_enabled_target_without_guest_volumes,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_source_without_guest_volumes;tc5

    # TC6: enabled source (no guest volumes) -> enabled target (target has guest volumes)
    test_enabled_source_without_guest_volumes_to_enabled_target_with_guest_volumes,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_source_without_guest_volumes;tc6

    # #########################################################################
    # backup_restore_source_with_guest_volumes - 100M, fresh source per case
    # #########################################################################

    # TC7: enabled source with guest volumes -> disabled target
    test_enabled_source_with_guest_volumes_to_disabled_target,num_docs=100000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,backup_timeout=21600,restore_timeout=21600,rebalance_timeout=14400,deploy_timeout=3600,GROUP=backup_restore_source_with_guest_volumes;tc7

    # TC8: enabled source with guest volumes -> enabled target (no target guest volumes)
    test_enabled_source_with_guest_volumes_to_enabled_target_without_guest_volumes,num_docs=100000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,backup_timeout=21600,restore_timeout=21600,rebalance_timeout=14400,deploy_timeout=3600,GROUP=backup_restore_source_with_guest_volumes;tc8

    # TC9: enabled source with guest volumes -> enabled target (both have guest volumes)
    test_enabled_source_with_guest_volumes_to_enabled_target_with_guest_volumes,num_docs=100000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,backup_timeout=21600,restore_timeout=21600,rebalance_timeout=14400,deploy_timeout=3600,GROUP=backup_restore_source_with_guest_volumes;tc9

    # TC11: enabled source with guest volumes -> target restored while enabling
    test_enabled_source_to_target_while_enabling,num_docs=100000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,backup_timeout=21600,restore_timeout=21600,rebalance_timeout=14400,deploy_timeout=3600,GROUP=backup_restore_source_with_guest_volumes;tc11

    # TC13: enabled source with guest volumes -> target restored while disabling (no target guest volumes)
    test_enabled_source_to_target_while_disabling_without_guest_volumes,num_docs=100000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,backup_timeout=21600,restore_timeout=21600,rebalance_timeout=14400,deploy_timeout=3600,GROUP=backup_restore_source_with_guest_volumes;tc13

    # TC15: enabled source with guest volumes -> target restored while disabling (target has guest volumes)
    test_enabled_source_to_target_while_disabling_with_guest_volumes,num_docs=100000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,backup_timeout=21600,restore_timeout=21600,rebalance_timeout=14400,deploy_timeout=3600,GROUP=backup_restore_source_with_guest_volumes;tc15

    # TC16 (self-cluster): enabled cluster with guest volumes backed up and restored onto itself
    test_enabled_source_with_guest_volumes_self_cluster_restore,num_docs=100000000,source_num_nodes=3,num_buckets=1,aws_region=us-east-1,backup_timeout=21600,restore_timeout=21600,rebalance_timeout=14400,deploy_timeout=3600,GROUP=backup_restore_source_with_guest_volumes;self_cluster

    # #########################################################################
    # backup_restore_cross_region - 30M, restore across regions (CR) + backup
    # copied across regions (CRB)
    # #########################################################################

    # TC18 (CR2): disabled source -> disabled target in alternate region
    test_disabled_source_cross_region_to_disabled_target,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_cross_region;cr2

    # TC20 (CRB1): disabled source -> cross-region backup -> disabled target in alternate region
    test_cross_region_backup_disabled_source_to_disabled_target,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_cross_region;crb;crb1

    # TC17 (CR1): enabled source with guest volumes -> enabled target in alternate region
    test_enabled_source_with_guest_volumes_cross_region_to_enabled_target,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_cross_region;cr1

    # TC19 (CR3): enabled source with guest volumes -> enabled target (with guest volumes) in alternate region
    test_enabled_source_with_guest_volumes_cross_region_to_enabled_target_with_guest_volumes,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_cross_region;cr3

    # TC21 (CRB2): enabled source with guest volumes -> cross-region backup -> enabled target in alternate region
    test_cross_region_backup_enabled_source_with_guest_volumes_to_enabled_target,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_cross_region;crb;crb2

    # TC22 (CRB3): enabled source with guest volumes -> cross-region backup -> enabled target (with guest volumes) in alternate region
    test_cross_region_backup_enabled_source_with_guest_volumes_to_enabled_target_with_guest_volumes,num_docs=30000000,source_num_nodes=3,target_num_nodes=3,num_buckets=1,aws_region=us-east-1,GROUP=backup_restore_cross_region;crb;crb3
