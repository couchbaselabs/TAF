# Fusion Accelerator Chaos / Negative Tests — Cloud (Capella)
#
# Fault-injection counterpart to fusion_accelerator_lifecycle_test.conf. Each entry injects
# a fault at a stage boundary from STAGE_TEST_MATRIX.md §"Negative Tests by Stage Boundary"
# and asserts the control plane recovers, refuses cleanly, or holds its safety invariant.
#
# Required runtime parameters (pass via -p):
#   aws_access_key=<key>
#   aws_secret_key=<secret>
#
# ---------------------------------------------------------------------------------------
# WHY EVERY ENTRY FREEZES MIGRATION
#
# The CP/CBS-boundary tests all set fusion_migration_rate_limit and rely on the freeze/resume
# lever, as does the volume-level AWS fault (force-detach from the accelerator). Guest
# volumes are deleted per shard as background migration completes, so without the freeze the
# resource a fault is meant to disturb — an attached volume, an occupied slot, an in-flight
# manifest — may already be gone when the fault lands. The freeze makes each fault land on a
# known, complete set of resources; the test then resumes migration and asserts the cluster
# still reclaims everything. tearDown restores the rate limit even if the test fails.
#
# In the lease-expiry entry (test_download_rate_limit_expires_lease_falls_back_to_dcp) the freeze
# serves the mirror-image purpose: nothing is expected to reach a KV node at all, and the freeze
# is what keeps a volume that DID get transferred attached and visible instead of being deleted
# per shard between two polls — so "no guest volume was ever attached to a KV node" is an
# observation rather than a poll-timing race.
#
# ---------------------------------------------------------------------------------------
# SIZING
#
# create_end is PER COLLECTION and these buckets get 2 collections, so total items =
# create_end x 2 (verified: create_end=50000000 gave curr_items total=100000000).
# fusion_threshold_gib is POSTed to settings/fusion as enableSyncThresholdMB = gib x 1024,
# so it genuinely selects the fusion path rather than documenting an assumption.
#
# At create_end=10000000, kv_nodes=3, replicas=1: 20M items => ~19 GiB logical =>
# ~38 GiB stored => ~12.7 GiB per host. With fusion_min_split_size_gb=5 that is 3 shards
# per host — enough of a fleet for the faults to be meaningful without a long load.
#
# ---------------------------------------------------------------------------------------
# Execution:
#   python testrunner.py -i node.ini \
#       -c conf/fusion/cloud/fusion_accelerator_chaos_test.conf \
#       -p aws_access_key=$AWS_ACCESS_KEY_ID,aws_secret_key=$AWS_SECRET_ACCESS_KEY
#
# Every entry carries GROUP=fusion_accelerator_chaos, so the whole suite can be selected or
# skipped from a larger run:
#   -p GROUP=fusion_accelerator_chaos          run only these
#   -p EXCLUDE_GROUP=fusion_accelerator_chaos  run everything else
# Both accept ';'-separated lists, and GROUP=ALL disables the filter.
#
# These are destructive by design (node removal, aborted rebalances, killed memcached,
# stopped and terminated instances, a force-detached volume).
# Run them against a cluster you are willing to have left in a degraded state if a
# recovery path turns out not to work — that is the finding.
#
# ---------------------------------------------------------------------------------------
# BOUNDING A HUNG RUN
#
# A CP that never reacts is a legitimate finding, but it must not cost days to report. One
# run diagnosed the hang at 2h and then spent 29 more hours waiting: 8h in
# wait_for_rebalances (its default monitor timeout, which the test used to leave unset), 2h
# in the post-fallback settle wait, 20min in the orphan check, and the rest in tearDown,
# where CapellaUtils.scale retried a spec update every 6h forever against a cluster wedged
# in 'scaling'.
#
#   test_budget_secs=14400      — whole-test wall clock budget from setUp. Once exceeded,
#                                 the long polling loops stop and the run reports what it
#                                 has. 0 disables.
#   hung_settle_timeout=120     — replaces post_fallback_settle_timeout once a stage has
#                                 established the rebalance is hung. The post-fallback
#                                 assertions are skipped too: there was no fallback, so
#                                 asserting on its aftermath reports misleading failures on
#                                 top of the real one.
#   topology_reset_timeout=1800 — how long tearDown waits for healthy before the topology
#                                 reset. If the cluster is still not healthy the reset is
#                                 ABANDONED, not retried — a wedged cluster rejects every
#                                 spec update, and the cluster is left for manual attention.
#
# CapellaUtils.scale itself is still an unbounded retry loop (it is shared by every dedicated
# test and was left alone). Instead, every mid-test rebalance trigger in this suite is gated on
# _wait_until_writable(), so scale() is never called on a cluster that would reject the spec
# update — the loop is avoided rather than interrupted, because nothing in the test can break
# into it once it starts. writable_wait_timeout (default 900s) bounds that gate.
# ---------------------------------------------------------------------------------------


aGoodDoctor.fusion.fusion_accelerator_chaos_test.FusionAcceleratorChaosTest:

    # Boundary E — remove a KV node while its guest volumes are still attached.
    # Two rebalances (in 3->4, then out 4->3) with migration frozen throughout, so the
    # departing node still holds volumes at the moment it is removed. Asserts no volume is
    # left attached to an instance that has left the cluster, then that everything drains.
    test_remove_node_with_attached_guest_volumes,create_end=50000000,doc_size=3072,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=5,read_workload_items=20000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1200,hydration_timeout=2400,rebalance_timeout=3600,fusion_migration_rate_limit=78643200,test_budget_secs=14400,hung_settle_timeout=120,topology_reset_timeout=1800,GROUP=fusion_accelerator_chaos

    # Boundary C->D — saturate guest volume slots, then rebalance again.
    # minSplitSize=2 GB against ~12.7 GiB per host wants ~7 shards; maxSlots=4 caps it, so
    # the cap binds and every host runs at its slot ceiling with migration frozen. The
    # second rebalance then has to fall back, refuse cleanly, or accommodate — all three are
    # recorded, and only a hang or leftover infrastructure fails the test.
    # maxSlots is deliberately 4 rather than 22: it makes the cap bind at a data volume that
    # loads in minutes, where reaching a real 22-slot ceiling needs far more data.
    test_slot_exhaustion_triggers_fallback_replacement,create_end=50000000,doc_size=3072,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=2,fusion_max_slots=4,read_workload_items=20000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1200,hydration_timeout=2400,rebalance_timeout=3600,fusion_migration_rate_limit=78643200,test_budget_secs=14400,hung_settle_timeout=120,topology_reset_timeout=1800,GROUP=fusion_accelerator_chaos

    # Boundary D — abort the CBS rebalance via /controller/stopRebalance. ACCELERATION.md
    # §Error Handling: the CP should detect ErrFusionPlanNotFound, mark the manifest
    # Invalidated and queue teardown. Asserts no accelerators, ASGs or guest volumes survive
    # the abort, and the cluster stays healthy with fusion enabled.
    #
    # TIMING IS THE TEST. Phases 4-6 (accelerator launch, S3 download, guest volume
    # transfer) are CP-owned and ns_server has no rebalance during them, so an abort sent
    # then aborts nothing. The test waits on /pools/default/rebalanceProgress and
    # /pools/default/tasks until CBS itself reports rebalancing — i.e. phase 7, when the CP
    # has called /controller/rebalance and the vBucket movement is CBS's — and only then
    # sends the abort, then confirms CBS actually stopped.
    # AND THE WINDOW IS A RACE. A measured run had the whole CBS rebalance finish in ~17s, with
    # the abort landing 12s in at 31.5% progress — ~5s from natural completion. ns_server
    # reports 'notRunning' for a stopped and a finished rebalance alike, so losing that race
    # looks identical to winning it.
    #
    # The on-prem test (test_abort_rebalance_lease_handling) solves this with
    # testconditions:set(rebalance_start, {delay, N}), which holds ns_server in 'running'
    # without moving a vBucket. That is NOT available here: /diag/eval does not work on Capella
    # dedicated. It was tried and removed. Two levers remain, and both only lengthen the window
    # — neither makes it deterministic:
    #
    #   1. fusion_min_split_size_gb=2 (was 5) — more shards, so more guest volumes to mount
    #                               onto the KV nodes, and that mounting is a stage inside the
    #                               CBS rebalance (stageInfo.mountingVolumes, 3.0s for 5
    #                               volumes in the measured run). At ~12.7 GiB/host,
    #                               ceil(12.7/2)=7 shards/host, capped by fusion_max_slots=8,
    #                               so ~7 per host. COST: one accelerator per shard, ~28 for a
    #                               4-host cluster — raise the split size or lower max_slots to
    #                               trade window length for spend. Does NOT increase the
    #                               vBucket movement work itself, only the mounting stage.
    #   2. abort_bg_load=True     — update-only mutations at rebl_ops_rate DURING the movement.
    #                               Mutations are on no guest volume, so each vBucket move has
    #                               to chase them through DCP; this is the only lever that
    #                               lengthens the movement itself. Stopped once the abort has
    #                               been observed, so the recovery rebalance stays a clean
    #                               baseline. Update-only on purpose: creates would move the
    #                               item count and deletes would fight the A7 read workload.
    #
    # BECAUSE IT IS A RACE, CHECK abort_progress_ceiling_pct ON EVERY RUN. It records an issue
    # whenever the abort landed above that much progress, which means the run probably raced
    # natural completion and its pass is unproven. That is now the only guard.
    #   abort_progress_ceiling_pct=90  — record an issue if the abort lands above this
    #   cbs_rebalance_poll_interval=5  — detection cadence. Must stay well under the movement
    #                                    duration (~17s measured) or the window is sampled once
    #                                    and missed.
    #   cbs_rebalance_wait_timeout     — how long to wait for the window to open
    #   abort_at_progress_pct=0        — abort as soon as CBS accepts the rebalance
    #   stop_rebalance_timeout         — how long to wait for CBS to report it has stopped
    #   accel_release_timeout        — how long to wait for the aborted plan's accelerators
    #                                  to terminate. NOTE A5 asserts only that; a CP retry
    #                                  (new ASGs/accelerators) is legitimate, and the aborted
    #                                  plan's guest volumes cannot be reclaimed while
    #                                  migration is frozen, so volume cleanup is asserted at
    #                                  A9c after migration resumes.
    #
    # RECOVERY: after the cleanup assertions the entry resumes migration and runs one NORMAL
    # fusion rebalance (post_abort_rebalance=True, set False to skip). Cleanup only proves the
    # abort tidied up; this proves the cluster is still usable — a manifest the CP still
    # counts as active would block the next rebalance outright. Direction is derived from the
    # node count ns_server actually reports (not the requested one, which an abort leaves
    # stale) and moves back toward kv_nodes, so it doubles as the topology restore.
    # Adds roughly one full fusion rebalance to the runtime.
    test_abort_rebalance_invalidates_manifest,create_end=10000000,doc_size=3072,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=2,fusion_max_slots=8,read_workload_items=20000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1800,rebalance_timeout=3600,fusion_migration_rate_limit=78643200,cbs_rebalance_wait_timeout=1800,abort_at_progress_pct=0,stop_rebalance_timeout=300,cbs_rebalance_poll_interval=5,abort_progress_ceiling_pct=90,accel_release_timeout=1800,abort_bg_load=True,rebl_ops_rate=5000,post_abort_rebalance=True,recovery_settle_timeout=1800,test_budget_secs=14400,hung_settle_timeout=120,topology_reset_timeout=1800,GROUP=fusion_accelerator_chaos

    # Boundary E — kill memcached (pkill -9, over SSM) on the node holding the most guest
    # volumes, while extent migration is demonstrably in progress. Asserts memcached is
    # restarted by ns_server, migration still completes, no ep_fusion_migration_failures,
    # and teardown is clean. migration_start_timeout bounds the wait for the copy to start;
    # memcached_restart_timeout bounds the wait for the process to come back.
    test_kill_memcached_during_extent_migration,create_end=10000000,doc_size=3072,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=2,fusion_min_split_size_gb=5,read_workload_items=20000,soft_fail_stages=True,fleet_stable_samples=3,gv_launch_timeout=1200,hydration_timeout=2400,rebalance_timeout=3600,fusion_migration_rate_limit=78643200,migration_start_timeout=600,memcached_restart_timeout=300,test_budget_secs=14400,hung_settle_timeout=120,topology_reset_timeout=1800,GROUP=fusion_accelerator_chaos

    # ---------------------------------------------------------------------------------
    # AWS infrastructure faults
    # ---------------------------------------------------------------------------------

    # A->B — terminate an accelerator mid-download (moved here from the lifecycle suite,
    # where it was test 11). Larger create_end on purpose: the termination has to land
    # while the download is still running.
    test_accelerator_node_termination_resilience,create_end=50000000,doc_size=3072,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=2,fusion_min_split_size_gb=5,relaunch_timeout=600,test_budget_secs=14400,hung_settle_timeout=120,topology_reset_timeout=1800,GROUP=fusion_accelerator_chaos

    # A->B — STOP an accelerator instead of terminating it. A stopped instance stays an ASG
    # member and merely fails its health check, so recovery runs through a different path
    # (and a different timeout) than the terminate case above.
    test_accelerator_stopped_mid_download,create_end=50000000,doc_size=3072,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=2,fusion_min_split_size_gb=5,instance_stop_timeout=300,stopped_recovery_timeout=900,read_workload_items=20000,soft_fail_stages=True,test_budget_secs=14400,hung_settle_timeout=120,topology_reset_timeout=1800,GROUP=fusion_accelerator_chaos

    # B — force-detach the download volume from its ACCELERATOR mid-download. Per
    # ACCELERATION.md §Phase 5 the agent has its volume ID baked in at launch and the CP
    # waits with exponential backoff for the node to report Complete, so recovery is either
    # a re-attach of the same volume or a redeployed accelerator with a new one. Both are
    # accepted; a node stuck with no volume while the CP backs off forever is the failure.
    # create_end is larger so the detach lands while the download is still running.
    test_accelerator_volume_detached_during_download,create_end=50000000,doc_size=3072,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=2,fusion_min_split_size_gb=5,read_workload_items=20000,soft_fail_stages=True,gv_launch_timeout=1200,detach_timeout=300,detach_download_recovery_timeout=1200,fusion_migration_rate_limit=78643200,test_budget_secs=14400,hung_settle_timeout=120,topology_reset_timeout=1800,GROUP=fusion_accelerator_chaos

    # B — throttle the accelerator's S3 download below the log-file lease TTL, so the
    # download cannot finish before CBS releases the leases the plan was built from, and
    # the CP has to abandon fusion and move the data over DCP instead.
    #
    # SIZING (this entry deliberately differs from every other one in this file):
    #   create_end=26000000 x 2 collections = 52M items x 1024 B ~= 49.6 GiB logical =>
    #   ~99 GiB stored at replicas=1 => ~33 GiB per host on 3 nodes. Adding a 4th node
    #   moves roughly a quarter of that, ~25 GiB, and that 25 GiB is what gets downloaded
    #   from S3 onto the incoming node.
    #
    #   fusion_min_split_size_gb is left UNSET (stock 50 GB) and fusion_max_slots=1 caps
    #   shards at one PER HOST. That does NOT produce a single accelerator: the observed run
    #   launched 4 accelerators with 4 shards, one holding ~26 GB and three holding tens of
    #   MB, because a scale-out moves some data to every host. The three small shards
    #   finished downloading in under a minute; the large one was still going 40 minutes
    #   later. That is the expected shape, and the test is built for it — Stage RL4 requires
    #   min_stuck_shards (default 1) shard to never reach a KV node, not that none do.
    #
    #   Note EBS volume size is useless as a shard-size signal: there is a 50 GiB
    #   provisioning floor, so that run reported [50, 50, 50, 50] GiB for shards spanning
    #   ~10 MB to ~26 GB. Stage RL2 only uses it as an upper bound.
    #
    #   fusion_download_rate_limit=1048576 B/s (1 MiB/s) => 25 GiB takes ~7.2 hours, i.e.
    #   over 7x the 1-hour (fusion_lease_seconds=3600) lease. Deliberately far more margin
    #   than the ~2x that 2.5 MiB/s would give: the whole test hinges on the download NOT
    #   finishing in time, and per-node vs cluster-aggregate throttle semantics are not
    #   documented, so a shard that turns out to download faster than projected must still
    #   miss the lease by a wide margin. The test re-derives this projection from the guest
    #   volume AWS actually creates and fails with the exact value to lower the rate to if
    #   the download would still beat the lease.
    #
    # VERDICT: the test does not read a CP status to decide the path was DCP. Shards are
    # handed to KV nodes individually as each finishes, and the fusion rebalance can only
    # complete once every shard is in place — so RL4 asserts at least min_stuck_shards
    # (default 1) shard never reached a KV node, which is enough to force the plan to be
    # abandoned. RL5 then checks CBS's own /fusion/activeGuestVolumes count does not exceed
    # the number of shards that actually completed. Both depend on migration staying frozen
    # (fusion_migration_rate_limit): once it resumes, CBS drains and releases those volumes
    # within ~2 minutes and the evidence is gone.
    #
    # TIMING: this entry runs for hours by construction — it has to outlast the lease, and
    # then wait for a full DCP rebalance of ~25 GiB afterwards. rebalance_timeout,
    # lease_expiry_recovery_timeout and post_fallback_settle_timeout are all sized for that.
    test_download_rate_limit_expires_lease_falls_back_to_dcp,create_end=26000000,doc_size=3072,replicas=1,num_buckets=1,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,sdk_timeout=60,index_timeout=7200,sync_wait_timeout=3600,fusion_threshold_gib=2,fusion_max_slots=1,fusion_download_rate_limit=1048576,fusion_lease_seconds=3600,min_stuck_shards=1,lease_expiry_recovery_timeout=7200,post_fallback_settle_timeout=7200,rebalance_timeout=21600,gv_launch_timeout=1800,read_workload_items=20000,soft_fail_stages=True,fusion_migration_rate_limit=78643200,test_budget_secs=14400,hung_settle_timeout=120,topology_reset_timeout=1800,GROUP=fusion_accelerator_chaos
