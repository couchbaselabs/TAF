# Fusion Billing — Cloud (Capella)  (AV-110004 / AV-94188)
#
# Verifies the control-plane billing docs (CP Couchbase DB, via the kubectl CP-DB
# util) against the AV-110004 / AV-28236 formulas. Pricing multipliers are read
# live from billing.credit_factors. Billing jobs are triggered on demand via
# POST /internal/support/jobs (internal-support token) — no top-of-hour waits.
#
# COST/TIME MODEL:
#   * Same-spec tests REUSE ONE cluster: the first test deploys + loads + rebalances;
#     the rest skip the heavy workload and just verify the shared billing docs. The
#     shared cluster is destroyed at the end of the run (unless keep_cluster=True) —
#     via the base's last-test destroy AND a tearDownClass safety net.
#   * own_cluster=True tests need a different topology (bucket count, node count,
#     2 clusters). They take a FRESH cluster, self-destroy, and restore the shared
#     pool so the other tests keep sharing. -> a full run is ~4-5 clusters, not ~12.
#   * keep_cluster=False (default here) => EVERY cluster is deleted at the end.
#   * create_end kept at 2M/bucket (~24 GiB) — above the 10 GiB fusion threshold but
#     under the volume that tmp-OOMs the loader.
#
# NO DUPLICATES: every entry below covers something no other entry covers.
# Each property is proven exactly ONCE, by whichever test can prove it most
# cheaply — notably the ENABLED charges are verified only by
# test_fusion_billing_e2e, and the real-cron path only by that same entry.
#
# TWO GROUPS (select at runtime with -p GROUP=<name>; no commenting needed):
#   billing_charge_correctness  — is each billing charge computed & recorded
#                                 correctly? SSD, bucket, variable, credits
#                                 total, no-dupes, TTL, free-tier boundary,
#                                 off-cluster billing. test_fusion_billing_e2e
#                                 runs on the REAL hourly cron
#                                 (trigger_billing_jobs=False) — every other
#                                 entry manual-triggers ClusterBilling with
#                                 serviceIds=[cluster_id], which is a targeted
#                                 request and NOT the production cron's shape
#                                 (it enumerates billable clusters itself).
#                                 Manual triggering only proves the biller
#                                 computes correctly when asked directly; it
#                                 cannot catch a bug in the real schedule or
#                                 enumeration. Both paths are covered, neither
#                                 is covered twice.
#   billing_lifecycle_and_totals — does billing behave correctly across state
#                                 changes (disable/scale), does the end-to-end
#                                 SFDC aggregate / priced record add up, and
#                                 (test_fleet_fusion_ssd_cost_coverage) does
#                                 the fixed SSD cost actually populate
#                                 fleet-wide rather than just on this run's
#                                 cluster (AV-140399 — no cluster, no wait).
#                                 test_fusion_disable_reenable_billing
#                                 covers the disable/re-enable toggle, the
#                                 cluster-disabled over-billing guard, AND is
#                                 the suite's manual-trigger test (it fires
#                                 both billing jobs on demand). It does not
#                                 re-verify the enabled charge values — e2e
#                                 owns that.
#   Run just one: -p GROUP=billing_charge_correctness (or billing_lifecycle_and_totals)
#   Run everything in this file: -p GROUP=ALL
#   NOTE: -p GROUP=billing_charge_correctness;billing_lifecycle_and_totals does
#   NOT mean "either group" — testrunner.py's GROUP filter is AND, not OR (it
#   requires every semicolon-separated name to be present on EACH test's own
#   single-value GROUP field). Since every test here belongs to exactly one
#   group, that syntax fails the check for ALL of them and runs nothing
#   ("Total test to be executed: 0"). GROUP=ALL is the only way to bypass the
#   filter and run every test regardless of group; there is no "OR of named
#   groups" syntax in testrunner.py's GROUP handling.
#
# Execution:
#   python testrunner.py -i fusion_billing.ini -c conf/fusion/cloud/fusion_billing_test.conf \
#     -p GROUP=billing_charge_correctness,load_docs_using=sirius_java_sdk,log_level=debug,infra_log_level=debug \
#     --launch_java_doc_loader --sirius_url http://localhost:<port>

aGoodDoctor.fusion.fusion_billing_test.FusionBillingTest:

    # ==================== GROUP: billing_charge_correctness ====================
    # "Are the fusion billing charges computed and recorded correctly?"

    # Full billing E2E on ONE cluster (bootstraps this group's shared
    # cluster). Verifies, in one run:
    #   fixed SSD per node = (diskGb*ebsListPrice/732)*SSDUplift ; fixed bucket
    #   per cluster = max(0,buckets-freeTier)*price ; variable = GiB*rate*
    #   cspUplift ; no duplicate (node,hour) records ; per-node coverage ;
    #   region-correct factors ; hourly continuity (interior/trailing/
    #   zero-cost gaps) ; fusion premium reaches the total ; and the EXACT
    #   ceil-quantised creditsConsumed decomposition.
    #
    # trigger_billing_jobs=False — runs on the REAL top-of-hour cron, with NO
    # on-demand ClusterBilling trigger. Every other entry in this conf
    # manual-triggers with serviceIds=[cluster_id], which is a targeted
    # request and NOT the shape of the production cron (which enumerates
    # billable clusters itself). Manual triggering only proves "the biller
    # computes correctly when asked directly for this cluster"; it cannot
    # catch a bug in the real schedule/enumeration deciding what to bill at
    # all. Running this test BOTH ways would be pure duplication — so it runs
    # once, the harder way. billing_wait_timeout raised for real hourly
    # cycles instead of the near-instant on-demand path.
    test_fusion_billing_e2e,runtype=dedicated,keep_cluster=False,trigger_billing_jobs=False,billing_wait_timeout=10800,create_end=2000000,doc_size=1024,replicas=1,bucket_ram_quota=2048,num_buckets=12,kv_nodes=3,region=us-east-1,kv_compute=m7g.4xlarge,kv_disk=200,kv_iops=8000,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=billing_charge_correctness

    # SAME test, different region: proves the fixed SSD price is read for
    # the CLUSTER's actual region, not hardcoded to us-east-1. Real signal
    # here — GP3 EBS genuinely differs by region (seed data: us-east-1
    # $0.08/GB-mo, eu-west-1 $0.088/GB-mo). NOT a cross-region test for the
    # variable-billing CSP uplift factor — that factor is currently seeded
    # at a flat 1.0 for every region (and AV-110004 itself calls these
    # "illustrative"/TBD values), so a second cluster just to compare a 1:1
    # ratio would cost a full cluster deploy for no real signal.
    test_fusion_billing_e2e,runtype=dedicated,keep_cluster=False,create_end=2000000,doc_size=1024,replicas=1,bucket_ram_quota=2048,num_buckets=12,kv_nodes=3,region=eu-west-1,kv_compute=m7g.4xlarge,kv_disk=200,kv_iops=8000,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,expected_ebs_price=0.088,GROUP=billing_charge_correctness

    # Two rebalances -> two distinct pagerTask plans, each priced independently
    # (proves no rebalance's GiB charge is dropped or double-counted).
    test_multiple_rebalances_variable,runtype=dedicated,keep_cluster=False,own_cluster=True,create_end=2000000,doc_size=1024,replicas=1,bucket_ram_quota=2048,num_buckets=12,kv_nodes=3,region=us-east-1,kv_compute=m7g.4xlarge,kv_disk=200,kv_iops=8000,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=billing_charge_correctness

    # Exactly ONE pagerTask per accelerator node (dedup key) -> no double variable
    # billing if /fusion/complete is retried.
    test_pager_task_idempotent,runtype=dedicated,keep_cluster=False,create_end=2000000,doc_size=1024,replicas=1,bucket_ram_quota=2048,num_buckets=12,kv_nodes=3,region=us-east-1,kv_compute=m7g.4xlarge,kv_disk=200,kv_iops=8000,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=billing_charge_correctness

    # pagerTask docs carry a ~1-year TTL so the collection self-prunes (never grows
    # unbounded) — checks META().expiration ~= now + 365d.
    test_pager_task_ttl,runtype=dedicated,keep_cluster=False,create_end=2000000,doc_size=1024,replicas=1,bucket_ram_quota=2048,num_buckets=12,kv_nodes=3,region=us-east-1,kv_compute=m7g.4xlarge,kv_disk=200,kv_iops=8000,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=billing_charge_correctness

    # Bucket free-tier boundary: with num_buckets = freeTier (10), the bucket charge
    # must be ZERO — catches an off-by-one in max(0, buckets-freeTier). own cluster.
    test_bucket_free_tier_boundary,runtype=dedicated,keep_cluster=False,own_cluster=True,create_end=2000000,doc_size=1024,replicas=1,bucket_ram_quota=2048,num_buckets=10,kv_nodes=3,region=us-east-1,kv_compute=m7g.4xlarge,kv_disk=200,kv_iops=8000,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=billing_charge_correctness

    # Off-cluster uplift gap: scale UP a couple of KV nodes, then turn the
    # cluster OFF and confirm debug.fusionCosts.fusionSSDCost is still > 0 on
    # a fresh isOff=true record (hard regression guard — fusion billing must
    # not silently drop to zero while off). Also logs (does NOT assert) the
    # gap between the billed-basis implied disk and the REAL AWS accelerator/
    # guest-volume size read via EC2Lib — a known, deliberate FinOps proxy
    # approximation (AV-123471), same gap on-cluster, not an off-specific bug.
    # own cluster (mutates nodes + on/off state).
    test_fusion_uplift_during_turnoff_after_scale,runtype=dedicated,keep_cluster=False,own_cluster=True,create_end=2000000,doc_size=1024,replicas=1,bucket_ram_quota=2048,num_buckets=12,kv_nodes=3,scale_up_nodes=2,region=us-east-1,kv_compute=m7g.4xlarge,kv_disk=200,kv_iops=8000,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=billing_charge_correctness

    # ==================== GROUP: billing_lifecycle_and_totals ====================
    # "Does billing behave correctly across state changes, and does the total add up?"

    # Toggle lifecycle + cluster-disabled over-billing guard. ALSO the
    # suite's MANUAL-TRIGGER test: test_fusion_billing_e2e runs on the real
    # cron with no on-demand poke, so this is what proves the on-demand path
    # works. Its baseline explicitly fires BOTH billing jobs and asserts each
    # was accepted, then verifies the records they produced:
    #     ClusterBilling -> hourly fixed biller (SSD + bucket)
    #     BillPagerTasks -> daily pager biller (priced variable)
    # Between the two entries, both trigger paths are covered exactly once.
    #   BASELINE  manual-trigger both jobs; SSD formula verified (so no
    #             separate SSD-hourly test is needed), bucket + variable
    #             non-zero. Doubles as the precondition for the phases below.
    #   PHASE A   billing FLAG off -> SSD, bucket AND variable all 0
    #   PHASE B   billing FLAG on  -> all three RESUME (catches "once
    #             disabled, billing never recovers")
    #   PHASE C   CLUSTER express scaling disabled -> SSD 0, bucket 0, no NEW
    #             pagerTask, but compute/storage STILL billed, so a billing
    #             outage cannot masquerade as "correctly not charging".
    # Does NOT re-verify the enabled charge values beyond the baseline —
    # test_fusion_billing_e2e owns the full enabled verification.
    # own_cluster=True is REQUIRED: Phase C mutates cluster-level fusion state
    # and must not touch the pool other tests reuse.
    test_fusion_disable_reenable_billing,runtype=dedicated,keep_cluster=False,own_cluster=True,billing_wait_timeout=14400,fusion_free_timeout=1800,create_end=2000000,doc_size=1024,replicas=1,bucket_ram_quota=2048,num_buckets=12,kv_nodes=3,region=us-east-1,kv_compute=m7g.4xlarge,kv_disk=200,kv_iops=8000,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=billing_lifecycle_and_totals

    # SFDC aggregate: POST /internal/support/f/aggregate returns the summed credits
    # sent to Salesforce; the variable total matches the pagerTask GiB*rate*uplift.
    test_aggregate_api_total,runtype=dedicated,keep_cluster=False,create_end=2000000,doc_size=1024,replicas=1,bucket_ram_quota=2048,num_buckets=12,kv_nodes=3,region=us-east-1,kv_compute=m7g.4xlarge,kv_disk=200,kv_iops=8000,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=billing_lifecycle_and_totals

    # Persisted priced record: after the pager biller runs, billing.variable has
    # usage = GiB moved and creditQuantity = GiB*rate*cspUplift (the invoiced doc).
    test_variable_record_after_rebalance,runtype=dedicated,keep_cluster=False,create_end=2000000,doc_size=1024,replicas=1,bucket_ram_quota=2048,num_buckets=12,kv_nodes=3,region=us-east-1,kv_compute=m7g.4xlarge,kv_disk=200,kv_iops=8000,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=billing_lifecycle_and_totals

    # Scale DOWN: after removing a KV node, the removed node stops being billed SSD
    # (billed-node count drops to the new node count). own cluster (mutates nodes).
    test_scale_down_billing,runtype=dedicated,keep_cluster=False,own_cluster=True,create_end=2000000,doc_size=1024,replicas=1,bucket_ram_quota=2048,num_buckets=12,kv_nodes=3,region=us-east-1,kv_compute=m7g.4xlarge,kv_disk=200,kv_iops=8000,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=billing_lifecycle_and_totals

    # Fleet-wide coverage survey — cheap, no new cluster, no wait, mutates
    # nothing. Two checks, both by the method that actually found AV-140399
    # (survey every cluster in the CP-DB, not just this run's own, which can
    # land in the lucky minority and prove nothing):
    #   FIXED    — did fusionSSDCost EVER go non-zero per fusion cluster?
    #              (AV-140399: 41/45 clusters never billed at all.)
    #   VARIABLE — any cluster with COMPLETED pagerTasks (data provably moved
    #              through the accelerator) but NO priced billing.variable
    #              record. That is the signature of the silent skip in
    #              variable/billers/fusion/biller.go:161-172, which `continue`s
    #              when a per-region CSP uplift factor is missing — while
    #              AV-110004 explicitly requires that case to FAIL so new CSP
    #              region pricing is defined before clusters land there.
    test_fleet_fusion_ssd_cost_coverage,runtype=dedicated,keep_cluster=False,create_end=2000000,doc_size=1024,replicas=1,bucket_ram_quota=2048,num_buckets=12,kv_nodes=3,region=us-east-1,kv_compute=m7g.4xlarge,kv_disk=200,kv_iops=8000,sdk_timeout=60,index_timeout=3600,sync_wait_timeout=1200,fusion_threshold_gib=10,GROUP=billing_lifecycle_and_totals

    # NOTE: bucket per-cluster charge needs couchbase-cloud PR #54446 in the build.
