# Fusion Accelerator Instance-Type Fallback — Cloud (Capella) Tests
#
# Validates the fusion accelerator ASG's instance-type fallback behaviour when
# top-priority EC2 types are unavailable at launch time (§8 AWS Fault
# Injection of the E2E Capella Integration Test Plan). Fault injection is via
# AWS FIS action aws:ec2:asg-insufficient-instance-capacity-error, which
# forces each fusion ASG to walk its 40-entry prioritized instance-type
# override list (see UNIFIED_INSTANCE_TYPES in fusion_fallback_test.py,
# mirrored from unifiedInstanceTypes in
# internal/clusters/fusion/infra/aws/autoscalinggroups.go).
#
# Required runtime parameters (pass via -p):
#   aws_access_key=<key>
#   aws_secret_key=<secret>
#
# fusion_threshold_gib=0 forces the fusion path even though these tests do not
# load data before triggering the rebalance (the fallback mechanism is
# exercised at ASG/instance-launch time, independent of data volume — see the
# commented-out data-load block in _run_fallback_test).
#
# fis_duration must be an ISO 8601 duration with the 'PT' time designator
# (e.g. PT15M, PT1H10M) — a bare 'H10M' value is rejected fast by the test
# before any AWS calls are made.
#
# Execution:
#   python testrunner.py -i node.ini \
#       -c conf/fusion/cloud/fusion_fallback_test.conf \
#       -p aws_access_key=$AWS_ACCESS_KEY_ID,aws_secret_key=$AWS_SECRET_ACCESS_KEY
#
# Every entry carries GROUP=fallback, so the whole suite can be selected or
# skipped from a larger run:
#   -p GROUP=fallback          run only these
#   -p EXCLUDE_GROUP=fallback  run everything else


aGoodDoctor.fusion.fusion_fallback_test.FusionFallbackInstanceTypeTests:

    # Fail the top N (default 3) priority instance types via FIS; verify the
    # ASG records exactly N capacity-failure scaling activities before the
    # (N+1)th type in the override list succeeds, and the fusion rebalance
    # still completes.
    test_fallback_when_top_n_instance_types_unavailable,fallback_n=3,fis_duration=PT15M,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,num_buckets=1,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=0,GROUP=fallback

    # Fail all 4 ARM-architecture types at the head of the priority list;
    # verify the ASG crosses the architecture boundary and launches an x86
    # instance (c6in.4xlarge or a later x86 entry).
    test_fallback_exhausts_all_arm_types_falls_back_to_x86,fis_duration=PT15M,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,num_buckets=1,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=0,GROUP=fallback

    # fallback_n=1000 exceeds every entry in the 40-type priority list, so FIS
    # (aws:ec2:asg-insufficient-instance-capacity-error) blocks EVERY RunInstances
    # call for the full fis_duration=PT1H10M rather than letting the (N+1)th type
    # through partway — the ASG keeps walking and re-walking its whole override
    # list, failing on every entry, for the entire 70-minute window. Intent: the
    # CP should give up on the accelerator/ASG path once it has exhausted every
    # available instance type for that long and fall back to a DCP rebalance
    # instead of leaving the scale-out wedged.
    # CAVEAT: _run_fallback_test's only success path is
    # _wait_for_all_asgs_inservice() after FIS naturally ends at fis_duration —
    # there is currently no assertion in fusion_fallback_test.py that checks for
    # (or accepts) a DCP-rebalance outcome. As written today this entry will FAIL
    # once FIS stops, unless a real instance type happens to succeed at that
    # point (nothing is failing it anymore) or the code is extended to assert the
    # DCP-fallback path explicitly. Flagging so this isn't a silent false pass/fail.
    test_fallback_when_top_n_instance_types_unavailable,fallback_n=1000,fis_duration=PT1H10M,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,num_buckets=1,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=600,fusion_threshold_gib=0,GROUP=fallback


# ---------------------------------------------------------------------------------------
# Single-ASG / worker-pool CP (couchbase-cloud feature/AV-142561_single_asg):
# persistent accelerator capacity shortfall.
#
# The CP creates one ASG per plan/AZ with MaxSize=DesiredCapacity=N (N = shards in
# that AZ) and accelerators pull guest volumes from a CP DB work pool. The test lowers
# each ASG's DesiredCapacity to k (accelerator_cap, default 'half' = MaxSize // 2)
# the moment it appears (MaxSize is CP-owned and left alone), waits for k InService
# workers, starts FIS
# aws:ec2:asg-insufficient-instance-capacity-error, gives back the N-k desired, and checks
# that the k workers download all N volumes, the rebalance completes through fusion
# (not DCP), ICE keeps the fleet below N (a few launches may slip in before FIS is
# enforced), and the accelerators and ASGs are torn down (guest volumes are not waited
# for: they go after background migration, which can take hours).
#
# Sizing: N must exceed k in at least one AZ. num_items=10000000 at doc_size=3072 is
# ~38 GiB stored (above the CP's 25 GiB fusion minimum); fusion_min_split_size_gb=1
# splits the incoming data into roughly ten 1 GiB shards for the added node's AZ.
#
# region=us-east-1 because the FIS execution role only trusts us-east-1 experiments.
# Elsewhere use ice_mode=cap (DesiredCapacity=k for the whole download, no FIS).
# fis_duration must outlast the whole download phase on k workers.
# verify_cp_nodes=True reads the CP DB fusion_accelerator_nodes docs through the CP
# EKS cluster (cp_eks_cluster_name / cp_role_arn are derived from the pod URL and
# account id; pass cp_external_id or jenkins_cpcli_role_external_id).
# ---------------------------------------------------------------------------------------
aGoodDoctor.fusion.fusion_fallback_test.FusionWorkerPoolShortfallTests:

    test_worker_pool_finishes_with_partial_fleet_under_ice,ice_mode=fis,fis_duration=PT2H,num_items=10000000,doc_size=3072,fusion_min_split_size_gb=1,verify_cp_nodes=True,kv_nodes=3,region=us-east-1,compute=c7g.4xlarge,disk=200,num_buckets=1,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=1200,gv_launch_timeout=1200,rebalance_timeout=7200,GROUP=fallback;worker_pool

    # Same scenario without FIS (any region): DesiredCapacity=k is kept for the whole download.
    test_worker_pool_finishes_with_partial_fleet_under_ice,ice_mode=cap,num_items=10000000,doc_size=3072,fusion_min_split_size_gb=1,verify_cp_nodes=True,kv_nodes=3,region=us-west-2,compute=c7g.4xlarge,disk=200,num_buckets=1,sdk_timeout=60,index_timeout=1800,sync_wait_timeout=1200,gv_launch_timeout=1200,rebalance_timeout=7200,GROUP=fallback;worker_pool
