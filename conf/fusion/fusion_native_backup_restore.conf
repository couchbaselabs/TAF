storage.fusion.fusion_native_backup_restore.FusionNativeBackupRestore:

    ##### Native accelerator-driven Fusion snapshot backup/restore #####
    # Restores one or more buckets' LogStore snapshots into new clone
    # bucket(s), via accelerator-cli generate-manifest / split-manifest /
    # download-files plus /controller/fusion/prepareSnapshotRestore and
    # /controller/fusion/restoreSnapshot.
    #
    # Every test method below supports both restore targets via a single
    # cross_cluster conf flag (default False = same cluster):
    #   - cross_cluster=False: restores onto self.cluster itself - the same
    #     cluster the bucket lives on.
    #   - cross_cluster=True: restores onto a real, independently-
    #     provisioned second cluster (self.dest_cluster, from spare .ini
    #     servers) instead. No outcome is assumed ahead of time:
    #     restoreSnapshot re-checks the cluster's current active KV node
    #     list against the plan captured at prepare time and rejects the
    #     call ("Nodes do not match restore plan") if it changed, or if the
    #     restoreSnapshot request doesn't name every active KV node exactly
    #     (confirmed against the ns_server source,
    #     fusion_backup.erl:validate_restore/2, MB-71396) - whether that
    #     constraint bites is exactly what these runs are finding out.
    #
    # This suite is weighted toward cross_cluster=True: same-cluster
    # correctness is already covered by a small baseline set below, so most
    # of the combination matrix is spent exercising the cross-cluster path
    # instead of duplicating coverage that same-cluster already proves.
    #
    # Contrast with fusion_backup_restore.conf's FusionBackupRestore, which
    # node_remap-clones the whole cluster onto separate destination nodes -
    # a completely different mechanism from either mode here.

    ##### Same-cluster baseline (minimal - just proving the core flow) #####

    # Restore the source bucket into a single new clone bucket.
    test_native_backup_restore_single_clone,num_items=5000000,nodes_init=1,sdk_timeout=60,ops_rate=30000,replicas=0,init_loading=False,bucket_ram_quota=1024,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=same_cluster

    # Baseline matrix point: 1 node, 1 bucket, 1 clone, replicas equal (0 == 0).
    test_native_backup_restore_matrix,num_items=5000000,nodes_init=1,num_clones=1,replicas=0,restore_replica_number=0,sdk_timeout=60,ops_rate=30000,init_loading=False,bucket_ram_quota=1024,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=same_cluster

    ##### Cross-cluster restore (cross_cluster=True) - primary focus #####
    # resolve_target_cluster() provisions a real, independent second cluster
    # (self.dest_cluster, from spare .ini servers - dest_num_nodes beyond
    # nodes_init) and runs the SAME flow (manifest, plan, accelerator-cli
    # downloads, restoreSnapshot, full verification) against it instead of
    # self.cluster. Reusing the same test methods (not a dedicated one)
    # keeps same-cluster and cross-cluster from drifting apart.

    # Single clone, cross-cluster.
    # Needs 2 servers: 1 source (nodes_init) + 1 destination (dest_num_nodes).
    test_native_backup_restore_single_clone,num_items=5000000,nodes_init=1,dest_num_nodes=1,cross_cluster=True,sdk_timeout=60,ops_rate=30000,replicas=0,restore_replica_number=0,init_loading=False,bucket_ram_quota=1024,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=cross_cluster

    # Multiple clones, cross-cluster, clones' replicaNumber equal to source (1 == 1).
    # Needs 3 servers: 2 source (nodes_init) + 1 destination (dest_num_nodes).
    test_native_backup_restore_multiple_clones,num_items=5000000,nodes_init=2,dest_num_nodes=1,cross_cluster=True,sdk_timeout=60,ops_rate=30000,replicas=1,restore_replica_number=1,init_loading=False,bucket_ram_quota=1024,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=cross_cluster

    # Multi-bucket multi-clone, cross-cluster: 3 source buckets x 2 clones
    # each = 6 new buckets, all from one manifest set/plan/restore call.
    # Needs 3 servers: 2 source (nodes_init) + 1 destination (dest_num_nodes).
    test_native_backup_restore_multiple_buckets_multiple_clones,num_items=5000000,nodes_init=2,dest_num_nodes=1,num_clones=2,standard_buckets=3,magma_buckets=3,cross_cluster=True,sdk_timeout=60,ops_rate=30000,replicas=0,restore_replica_number=0,init_loading=False,bucket_ram_quota=256,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=cross_cluster

    ##### Cross-cluster combination matrix (test_native_backup_restore_matrix, cross_cluster=True) #####
    # Sweeps {source node count, destination node count, buckets restored
    # (all/subset), clones/bucket, restore replicas vs source replicas} -
    # this is where most of the matrix coverage now lives.

    # A) Destination SMALLER than source (2 source nodes -> 1 dest node),
    #    1 bucket, 1 clone, replicas equal (0 == 0).
    test_native_backup_restore_matrix,num_items=5000000,nodes_init=2,dest_num_nodes=1,cross_cluster=True,num_clones=1,replicas=0,restore_replica_number=0,sdk_timeout=60,ops_rate=30000,init_loading=False,bucket_ram_quota=1024,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=cross_cluster

    # B) Destination LARGER than source (1 source node -> 3 dest nodes),
    #    1 bucket, 1 clone, restore replicas INCREASED (0 -> 2; the larger
    #    destination cluster has room to place them).
    test_native_backup_restore_matrix,num_items=5000000,nodes_init=1,dest_num_nodes=3,cross_cluster=True,num_clones=1,replicas=0,restore_replica_number=2,sdk_timeout=60,ops_rate=30000,init_loading=False,bucket_ram_quota=1024,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=cross_cluster

    # C) Destination EQUAL to source, both multi-node (2 == 2), 1 bucket,
    #    1 clone, restore replicas DECREASED relative to source (2 -> 0).
    test_native_backup_restore_matrix,num_items=5000000,nodes_init=2,dest_num_nodes=2,cross_cluster=True,num_clones=1,replicas=2,restore_replica_number=0,sdk_timeout=60,ops_rate=30000,init_loading=False,bucket_ram_quota=1024,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=cross_cluster

    # D) Restore replicas EQUAL to source, both non-zero (1 == 1), dest
    #    equal to source (2 == 2).
    test_native_backup_restore_matrix,num_items=5000000,nodes_init=2,dest_num_nodes=2,cross_cluster=True,num_clones=1,replicas=1,restore_replica_number=1,sdk_timeout=60,ops_rate=30000,init_loading=False,bucket_ram_quota=1024,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=cross_cluster

    # E) Multi-bucket: restore ALL 3 source buckets (default
    #    num_buckets_to_restore = all), 2 clones each = 6 clone buckets,
    #    destination smaller than source (2 -> 1).
    test_native_backup_restore_matrix,num_items=5000000,nodes_init=2,dest_num_nodes=1,cross_cluster=True,num_clones=2,standard_buckets=3,magma_buckets=3,replicas=0,restore_replica_number=0,sdk_timeout=60,ops_rate=30000,init_loading=False,bucket_ram_quota=256,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=cross_cluster

    # F) Multi-bucket SELECTIVE: 3 source buckets exist (magma.0/1/2), only
    #    restore 2 of them (magma.0, magma.1), 1 clone each, destination
    #    equal to source (2 == 2).
    test_native_backup_restore_matrix,num_items=5000000,nodes_init=2,dest_num_nodes=2,cross_cluster=True,num_clones=1,standard_buckets=3,magma_buckets=3,restore_bucket_names=magma.0\,magma.1,replicas=0,restore_replica_number=0,sdk_timeout=60,ops_rate=30000,init_loading=False,bucket_ram_quota=256,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=cross_cluster

    # G) Multi-bucket ALL (2 buckets) x 3 clones each = 6 clone buckets,
    #    destination larger than source (1 -> 2).
    test_native_backup_restore_matrix,num_items=5000000,nodes_init=1,dest_num_nodes=2,cross_cluster=True,num_clones=3,standard_buckets=2,magma_buckets=2,replicas=0,restore_replica_number=0,sdk_timeout=60,ops_rate=30000,init_loading=False,bucket_ram_quota=256,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=cross_cluster

    # H) Baseline cross-cluster matrix point (mirrors the same-cluster
    #    baseline above): 1 source node, 1 dest node, 1 bucket, 1 clone,
    #    replicas equal (0 == 0).
    test_native_backup_restore_matrix,num_items=5000000,nodes_init=1,dest_num_nodes=1,cross_cluster=True,num_clones=1,replicas=0,restore_replica_number=0,sdk_timeout=60,ops_rate=30000,init_loading=False,bucket_ram_quota=1024,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=cross_cluster

    # I) Fan-out: 10 clone buckets from a single source bucket in one
    #    prepare/restore call, replicas equal (2 == 2). 3 nodes each side
    #    so the 2 replicas actually have somewhere to land (1 active + 2
    #    replica copies across 3 nodes).
    # Needs 6 servers: 3 source (nodes_init) + 3 destination (dest_num_nodes).
    test_native_backup_restore_matrix,num_items=1000000,nodes_init=3,dest_num_nodes=3,cross_cluster=True,num_clones=10,replicas=2,restore_replica_number=2,sdk_timeout=60,ops_rate=30000,init_loading=False,bucket_ram_quota=256,doc_size=1024,fusion_log_store_uri=local:///mnt/nfs/share/buckets,monitor_log_store=False,fusion_test=True,load_docs_using=sirius_java_sdk,GROUP=cross_cluster
