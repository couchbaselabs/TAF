storage.magma.magma_endurance.MagmaEnduranceTest:

    # Test: Magma endurance on a single target vBucket
    #
    # Loads cold / warm / hot docs into one vBucket, keeps updating the hot
    # docs until the target index maxSn advances by seqno_threshold_per_cycle
    # (default 3B, past INT32_MAX), then runs checkpoint actions: slow
    # mutations, memcached kill + read-back, item counts, GSI count/rebuild,
    # rollback, compaction, magma_dump duplicate check, swap rebalance,
    # failover + full/delta recovery, XDCR, temp collection create/drop and
    # a coredump check. Repeats for num_cycles. No overall time limit.
    #
    # Node needs (.ini):
    #   nodes_init nodes, plus 1 spare for the swap rebalance,
    #   plus xdcr_remote_nodes spares when enable_xdcr=True
    #
    # Parameters:
    #   seqno_threshold_per_cycle - maxSn progress per cycle before checkpoint (default 3000000000)
    #   num_cycles                - number of cycles (default 10)
    #   target_index              - keyIndex / seqIndex / localIndex to monitor (default keyIndex)
    #   seqno_check_interval      - seconds between maxSn polls (default 1800)
    #   max_sn_read_failures      - consecutive unreadable maxSn polls before failing (default 5)
    #   cold_docs / warm_docs / hot_docs - docs per class (default 100000 each)
    #   ops                       - hot update ops/sec (default 50000)
    #   enable_xdcr               - run intra + inter cluster XDCR checks each checkpoint
    #
    # init_loading=False: the rollback check expects exactly cold+warm+hot docs
    # in _default, so the base-class initial load must not run

    test_magma_endurance,nodes_init=4,services_init=kv-kv-kv-index:n1ql,replicas=1,init_loading=False,num_items=0,doc_size=1024,num_cycles=10,GROUP=P0;endurance

    test_magma_endurance,nodes_init=4,services_init=kv-kv-kv-index:n1ql,replicas=1,init_loading=False,num_items=0,doc_size=1024,num_cycles=10,enable_xdcr=True,xdcr_remote_nodes=1,GROUP=P1;endurance_xdcr
