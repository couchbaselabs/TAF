# ============================================================================
# MAGMA COMPRESSION -- DATA AUTO-TUNING ON vs OFF (complete matrix)
# 3 data patterns x 9 configs x 2 tune states (ON/OFF) = 54 entries.
# num_iterations=3 (reduced from 4).
#
# GROUP is split by pattern AND tune state (<pattern>_ON / <pattern>_OFF),
# so each GROUP is homogeneous: exactly 9 entries (one per config), all
# sharing the same enable_data_autotuning value. Triggering all 6 groups
# runs 6 Jenkins jobs x 9 test cases each, instead of 3 jobs x 18 mixed.
#
# Patterns chosen to span the compressibility spectrum with the same
# Sirius JSON loader path (no confound from switching load mechanism):
#   Hotel              ~50-60% -- realistic, production representative
#   SimpleValue        ~80%    -- best-case ceiling
#   RandomlyNestedJson ~5-10%  -- near-incompressible, worst case
#
# Zstd levels: 1, 15, 19, 22 (13 dropped as redundant with 15 -- per
# zstd's clevels.h, both the <=128KB and <=16KB parameter tables show
# 13 and 15 share the same strategy family (btopt/btultra) and window/
# chain/hash logs, differing only in search effort -- 15 already covers
# that regime at its peak. Kept levels each represent a distinct regime:
#   1  = zstd fast-path baseline
#   15 = peak of the btopt/btultra family
#   19 = entry into the btultra2 family (most advanced strategy)
#   22 = max-effort ceiling
#
# Scale/quota match the original Jenkins run that produced the
# SimpleValue/Hotel comparison (Compression.txt, job temp_job_shivam_py3_5):
#   num_items=25000000, doc_size=1024, bucket_ram_quota=512.
# enable_index_autotuning=True in every run; only enable_data_autotuning
# varies -- fixed per GROUP (not mixed within a group):
#   Hotel                GROUP=P0_ON / P0_OFF
#   SimpleValue          GROUP=P1_ON / P1_OFF
#   RandomlyNestedJson   GROUP=P2_ON / P2_OFF
# ============================================================================

