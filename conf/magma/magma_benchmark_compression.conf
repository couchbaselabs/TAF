# ============================================================================
# ON-DISK SIZE VS FRAGMENTATION — test_disk_usage_vs_fragmentation
# 7 algo combinations × 4 schemas = 28 test cases.
#
# ALGO COMBINATIONS (index=lz4 always except Baseline):
#   P2 = Baseline          index=none, data=none,   compacted=none
#   P3 = Snappy            index=lz4,  data=snappy, compacted=snappy
#   P3 = LZ4               index=lz4,  data=lz4,    compacted=lz4
#   P3 = Zstd level 1      index=lz4,  data=zstd_1, compacted=zstd_1
#   P4 = LZ4 + Zstd        index=lz4,  data=lz4,    compacted=zstd_1
#   P4 = Snappy + Zstd     index=lz4,  data=snappy, compacted=zstd_1
#   P4 = Snappy + LZ4      index=lz4,  data=snappy, compacted=lz4
#
# SCHEMAS (compressibility spectrum):
#   SimpleValue        ~80%    best-case ceiling
#   Hotel              ~50-60% realistic, production representative
#   Product            ~30-40% mixed numeric/string, limited headroom
#   RandomlyNestedJson ~5-10%  near-incompressible, no-expansion safety
# ============================================================================

