###################################################################################################
# AWS availability-zone selection on cluster create, couchbase-cloud PR 58599
# (AV-147009, AV-147082, AV-147261, AV-147262).
#
# Test GROUPING:
#     - P0 : No cluster is deployed (zone catalog, rejected creates, wrapper cluster GET/list).
#     - P1 : Deploys real AWS/GCP clusters, deleted again in tearDown.
#     - SUPPORT : Calls /internal/support; needs internal_support_token or the executor's
#                 *_token_for_internal_support env var.
#
# Params:
#     - cases : Run only these case IDs, e.g. cases=H1;H3. DEFAULT = all cases of the test.
#     - server_version : The server version for the clusters. DEFAULT = [capella] server_version or 7.6
###################################################################################################

Capella.RestAPIv4.Clusters.zone_selection.ClusterZoneSelection:
    test_zone_discovery,GROUP=P0
    test_create_with_invalid_zones,GROUP=P0
    test_get_and_list_zones,GROUP=P0
    test_support_api_invalid_zones,GROUP=P0;SUPPORT
    test_create_with_zones,GROUP=P1
    test_support_api_create_with_zones,GROUP=P1;SUPPORT
