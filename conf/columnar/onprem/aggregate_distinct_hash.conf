####
# Hash COUNT(DISTINCT) (MB-72573) - full functional suite, single node.
#
# Every line carries its priority as a GROUP tag alongside its functional tag,
# e.g. GROUP=sanity;P1. GROUP filtering is AND (testrunner.py:166), so
# `-p GROUP=P0;P1` matches nothing; use EXCLUDE_GROUP to widen instead:
#   P0 + P1 (routine)      -p EXCLUDE_GROUP=P2
#   everything incl. P2    (no group param)
#   P0 only                -p GROUP=P0
#   P2 only                -p GROUP=P2
#
# The 5 P2 cases are the heavier spill / restart paths and are slower; several
# may fail while MB-72573 is open.
####
Columnar.aggregate_distinct_hash.AggregateDistinctHash:
    # P0
    test_default_is_disabled,GROUP=sanity;P0,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_flag_routes_to_hash_operator,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_exact_option_string,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
