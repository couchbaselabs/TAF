Columnar.query_plan_cache.QueryPlanCache:
    # Exhaustive suite: every per-variant line and every case, including the P2
    # sweeps. query_plan_cache_core.conf is the reduced 38-line version for
    # routine runs.
    #
    # PRIORITIES ARE COMMENTS, NOT GROUPS. GROUP carries a single tag, comma
    # separated - the same shape as aggregate_distinct_hash.conf and
    # lsm_sampling.conf. `-p GROUP=P0` therefore selects NOTHING here (it would
    # exit having run zero tests, not error); use `# P0` / `# P1` / `# P2` below
    # to read priority, and -t to run one case. The GROUP tags that DO filter
    # are sanity / concurrency / links / topology - in particular
    # `-p EXCLUDE_GROUP=topology` is what keeps the destructive rebalance and
    # failover cases out of a `-g conf/columnar/onprem` sweep, which globs every
    # *.conf it finds (framework.py:311).

    # cache key semantics - what makes a HIT vs a MISS
    # P0
    test_hit_miss,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_query_text_difference,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_parameterized_values,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    # P1
    test_query_context_difference,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_parameterized_type_difference,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_plan_affecting_setting_difference,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_non_plan_affecting_params,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True

    # opting out - skip-plan-cache, disable, EXPLAIN
    # P0
    test_skip_plan_cache,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    # P1
    test_skip_does_not_evict,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_set_disable_plan_cache,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_explain_not_cached,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True

    # admin API - DELETE /api/v1/plan_cache and capacity validation
    # P0
    test_admin_clear_cache,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    # P1
    test_non_delete_verb_405,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_negative_capacity_rejected,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True

    # capacity + LRU eviction (these restart / resize the service)
    # P0
    test_capacity_zero_disables,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_capacity_lru_eviction,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    # P1
    test_live_resize_evicts,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_lru_recency_on_hit,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True

    # invalidation - DDL that must clear the cache, and DDL that must not
    # P0
    test_create_index_invalidates,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    # P1
    test_drop_collection_invalidates,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_drop_database_invalidates,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_drop_view_invalidates,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    # MB-74020/ASTERIXDB-3886: CREATE FUNCTION/VIEW also invalidate, not just drops.
    test_create_function_invalidates,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_create_view_invalidates,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_global_invalidation_clears_unrelated,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_non_triggers_do_not_invalidate,GROUP=sanity,non_trigger=create_collection,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_non_triggers_do_not_invalidate,GROUP=sanity,non_trigger=create_synonym,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_non_triggers_do_not_invalidate,GROUP=sanity,non_trigger=insert,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_non_triggers_do_not_invalidate,GROUP=sanity,non_trigger=set,skip_setup_cleanup=True,skip_teardown_cleanup=True

    # never cached - DDL, DML, compile errors
    # P1
    test_ddl_never_cached,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_dml_never_cached,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_compile_error_not_cached,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_plan_cached_on_compile_despite_runtime_failure,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True

    # result freshness on a HIT
    # P0
    test_fresh_results_after_data_change,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    # P1
    test_analyze_reoptimizes_correctly,GROUP=sanity,analyze_op=analyze,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_analyze_reoptimizes_correctly,GROUP=sanity,analyze_op=drop_statistics,skip_setup_cleanup=True,skip_teardown_cleanup=True
    # P2
    test_warnings_not_stale_on_hit,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True

    # CBO + plan-shape matrix
    # P0
    test_cbo_correctness,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    # P1
    test_matrix_hit_miss,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True

    # RBAC
    # P0
    test_non_admin_clear_rejected,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_rbac_enforced_on_hit,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_authz_enforced_after_revoke,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True
    # P1
    test_no_cross_user_leakage,GROUP=sanity,skip_setup_cleanup=True,skip_teardown_cleanup=True

    # concurrency - matrix over herd size and race sizing
    # P1
    test_thundering_herd_cold_miss,GROUP=concurrency,herd_size=15,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_invalidation_races_lookup,GROUP=concurrency,race_queries=20,race_query_threads=3,race_invalidations=8,skip_setup_cleanup=True,skip_teardown_cleanup=True
    # P2
    test_thundering_herd_cold_miss,GROUP=concurrency,herd_size=50,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_invalidation_races_lookup,GROUP=concurrency,race_queries=40,race_query_threads=5,race_invalidations=12,skip_setup_cleanup=True,skip_teardown_cleanup=True

    # scale - matrix over capacity/query count. scale_queries MUST exceed
    # scale_capacity. Q is heavy: the P2 line roughly doubles the runtime.
    # P1
    test_scale_many_distinct_plans,GROUP=scale,scale_capacity=100,scale_queries=150,skip_setup_cleanup=True,skip_teardown_cleanup=True
    # P2
    test_scale_many_distinct_plans,GROUP=scale,scale_capacity=200,scale_queries=300,skip_setup_cleanup=True,skip_teardown_cleanup=True

    # links - single cluster (S3 link, placeholder creds, DDL only)
    # P0
    test_link_ddl_invalidates,GROUP=links,link_ddl=create,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_link_ddl_invalidates,GROUP=links,link_ddl=alter,skip_setup_cleanup=True,skip_teardown_cleanup=True
    test_link_ddl_invalidates,GROUP=links,link_ddl=drop,skip_setup_cleanup=True,skip_teardown_cleanup=True

    # links - REQUIRE a 2-cluster ini (analytics + remote KV). They FAIL,
    # not skip, on a single-cluster ini. See query_plan_cache_remote.conf.
    # P1
    test_connect_disconnect_does_not_invalidate,GROUP=remote,skip_setup_cleanup=True,skip_teardown_cleanup=True

    # topology - LAST. Every line here MUST keep skip_teardown_cleanup=True.
    # It gates tearDownEverything() (onPrem_basetestcase.py:1028), and for
    # runtype=onprem-columnar that method unconditionally does "Delete all
    # buckets and rebalance out other nodes" (:1122) and may reset the ejected
    # nodes to uninitialized (:1127). It does NOT restore anything. Omitting the
    # flag on test_rebalance_invalidates tore the cluster down to one node and
    # made every following test fail on the missing second node (seen 2026-08-27).
    # These lines deliberately OMIT skip_setup_cleanup and set nodes_init=2: the
    # base setUp then rebuilds the cluster to TWO cbas nodes before every test
    # (cbas_base_EA.py:328-334), which is what restores topology after a test
    # that changed it. nodes_init is REQUIRED; it defaults to 1, which makes the
    # re-add `servers[1:1]` empty, so the cleanup ejects the other nodes and
    # nothing comes back. That rebuild does nothing for the LAST test of a run,
    # so tearDown also rebalances a node back in when a topology test left the
    # cluster short (_restore_topology_if_shrunk).
    # P1
    test_cross_node_shared_hit,nodes_init=2,GROUP=topology,skip_teardown_cleanup=True
    # P0
    test_rebalance_invalidates,nodes_init=2,GROUP=topology,skip_teardown_cleanup=True
    # P1
    test_failover_invalidates,nodes_init=2,GROUP=topology,failover_type=Hard,skip_teardown_cleanup=True
