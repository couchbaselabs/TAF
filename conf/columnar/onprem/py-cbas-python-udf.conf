Columnar.cbas_python_udf.CBASPythonUDF:
    # Run this first -- several type-mapping checks are written to tolerate
    # either marshaling shape rather than assume one, but this is the check
    # that empirically settles which shape Enterprise Analytics actually
    # uses. See test plan §4 and the handoff's Open Questions.
    test_argument_marshaling_convention,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET1

    # §2 Library Lifecycle
    test_library_upload_and_metadata,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET1
    test_library_listing_always_empty_known_bug,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET1
    test_library_upload_rejects_malformed_archives,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET1
    test_library_upsert_takes_effect,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET1
    test_library_drop_breaks_bound_function,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET1
    test_library_same_name_different_scopes,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET1
    test_library_survives_service_restart,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET1

    # §3 Function Definition and Binding
    test_bind_class_method,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET2
    test_bind_module_level_function,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET2
    test_lazy_binding_unresolved_symbol_fails_at_first_call,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET2
    test_arity_mismatch_error_at_first_call,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET2
    test_create_or_replace_rebinds_to_different_library,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET2
    test_drop_function_if_exists,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET2
    test_with_clause_defaults_and_round_trip,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET2
    test_dropping_library_referenced_by_function,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET2
    test_overloads_bind_to_independent_libraries,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET3
    test_variadic_rejected_for_external_functions,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET3

    # §6 Type Mappings
    test_scalar_roundtrip,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET3
    test_array_and_object_roundtrip,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET3
    test_none_return_becomes_null,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET3
    test_unsupported_type_rejected_cast_succeeds,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET3
    test_null_call_flag_skip_behavior,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET3
    test_boundary_values,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P0SET3

    # §5 RBAC and Privilege Enforcement -- P1, release-gating (no new
    # infrastructure; see the coverage-gap analysis, 13 Sep 2026)
    test_rbac_define_function_requires_diag_write,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET1
    test_rbac_execute_privilege_load_bearing,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET1
    test_rbac_select_only_user_can_execute_not_manage,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET1
    test_rbac_no_privileges_denied_entirely,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET1
    test_rbac_no_indirect_definition_path,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET1
    test_rbac_hostile_argument_data_no_host_effect,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET1
    test_rbac_no_per_user_sandboxing_shared_trust,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET1

    # §9 Sandbox Isolation and Security -- P1, release-gating. Needs the
    # new sandbox-probe fixture and host observer (udf_sandbox_probe_utils.py).
    test_sandbox_no_network_stack,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2
    test_sandbox_library_mount_read_only,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2
    test_sandbox_cannot_read_host_paths,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2
    test_sandbox_host_process_and_syscalls_no_host_effect,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2
    test_sandbox_unsandboxed_path_cannot_be_selected,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2
    test_sandbox_ds_path_length_limit_handled_cleanly,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2
    test_sandbox_ncconfig_python_options_not_silently_honoured,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2
    test_sandbox_runsc_flags_registered_correctly,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2
    test_sandbox_shared_socket_directory_no_crosstalk,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2
    test_sandbox_one_shared_container_no_cross_library_file_access,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2
    test_sandbox_direct_escape_attempts_fail,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2
    test_sandbox_module_curtain_bypass_is_a_finding_not_a_blocker,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2
    test_sandbox_audit_events_no_content_leak,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2
    test_sandbox_failing_udf_does_not_destabilize_neighbor_query,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET2

    # §10 Resource Limits and Failure Handling -- P1, release-gating.
    # Kept in its OWN group deliberately: these tests kill and stress the
    # single executor container every other test in this conf depends
    # on. Run this group in isolation (or last), and expect several of
    # these to file gaps rather than pass -- the plan itself confirms no
    # resource limits are configured yet. Each attack here is scaled
    # down from the plan's literal ask (bounded loops, not a real fork
    # bomb; a manual recovery after a container kill, not reliance on
    # the shipped unit) specifically so a bad result doesn't leave the
    # shared executor -- and the rest of this run -- unusable.
    test_resource_cpu_or_walltime_limit,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET3
    test_resource_limits_configurability_documented_gap,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET3
    test_resource_memory_ceiling_documented_gap,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET3
    test_resource_uncaught_exception_surfaces_and_recovers,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET3
    test_resource_executor_kill_mid_query_recovery,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET3
    test_resource_hostile_udf_bounded_dos_attempt,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET3
    test_resource_sustained_concurrency_no_leak,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET3
    test_resource_udf_errors_distinguishable_from_other_error_classes,services_init=kv:cbas-kv:cbas,nodes_init=2,GROUP=P1SET3
