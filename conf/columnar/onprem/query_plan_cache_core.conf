####
# Query plan cache (MB-72415) - reduced suite for routine runs.
#
# Every line carries its priority as a GROUP tag alongside its functional tag,
# e.g. GROUP=sanity;P1. GROUP filtering is AND (testrunner.py:166), so
# `-p GROUP=P0;P1` matches nothing; use EXCLUDE_GROUP to widen instead:
#   P0 + P1 (routine)      -p EXCLUDE_GROUP=P2
#   everything incl. P2    (no group param)
#   P0 only                -p GROUP=P0
#   P2 only                -p GROUP=P2
#   skip destructive       -p EXCLUDE_GROUP=P2;topology
####
Columnar.query_plan_cache.QueryPlanCache:
    # P0
    test_query_text_difference,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_parameterized_values,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    # P1
    test_query_context_difference,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_plan_affecting_setting_difference,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_non_plan_affecting_params,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True

    # opting out - skip-plan-cache, disable, EXPLAIN
    # P0
    test_skip_plan_cache,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    # P1
    test_skip_does_not_evict,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_set_disable_plan_cache,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_explain_not_cached,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True

    # admin API - DELETE /api/v1/plan_cache and capacity validation
    # P0
    test_admin_clear_cache,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    # P1
    test_non_delete_verb_405,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_negative_capacity_rejected,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True

    # capacity + LRU eviction (these restart / resize the service)
    # (test_capacity_lru_eviction dropped and test_lru_recency_on_hit promoted
    #  to P0: recency_on_hit uses the same capacity-2 setup and proves BOTH that
    #  the LRU entry is evicted at capacity AND that a hit refreshes recency.)
    # P0
    test_capacity_zero_disables,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_lru_recency_on_hit,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    # P1
    test_live_resize_evicts,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True

    # invalidation - DDL that must clear the cache, and DDL that must not
    # (test_create_index_invalidates dropped and
    #  test_global_invalidation_clears_unrelated promoted to P0: same CREATE
    #  INDEX trigger, same warm-Q -> assert-miss-Q, plus the unrelated-plan
    #  eviction that proves the clear is whole-cache.)
    # P0
    test_global_invalidation_clears_unrelated,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    # P1
    test_drop_collection_invalidates,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_drop_database_invalidates,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_drop_view_invalidates,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    # 5 lines -> 1: `all` runs create_collection, create_synonym, create_function,
    # insert and set against one warm cache, asserting each separately.
    test_non_triggers_do_not_invalidate,GROUP=sanity;P1,non_trigger=all,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True

    # never cached - DDL, DML, compile errors
    # P1
    test_ddl_never_cached,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_dml_never_cached,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_compile_error_not_cached,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_plan_cached_on_compile_despite_runtime_failure,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True

    # result freshness on a HIT
    # P0
    test_fresh_results_after_data_change,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    # P1
    test_warnings_not_stale_on_hit,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    # 2 lines -> 1: ANALYZE creates the statistics DROP STATISTICS then drops,
    # so `all` runs both in sequence off one setUp.
    test_analyze_reoptimizes_correctly,GROUP=sanity;P1,analyze_op=all,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True

    # CBO + plan-shape matrix (matrix_hit_miss is now the P0 hit/miss case)
    # P0
    test_cbo_correctness,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_matrix_hit_miss,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True

    # RBAC
    # (test_rbac_enforced_on_hit dropped: it and test_authz_enforced_after_revoke
    #  assert the identical invariant - admin warms a plan on a protected
    #  collection, an analytics_reader user is then DENIED and gets no rows.
    #  Only the route to under-privileged differed. The revoke variant is kept
    #  because the demotion additionally proves no stale auth is cached.)
    # P0
    test_non_admin_clear_rejected,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_authz_enforced_after_revoke,GROUP=sanity;P0,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    # P1
    test_no_cross_user_leakage,GROUP=sanity;P1,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True

    # concurrency - matrix over herd size and race sizing
    # P1
    test_thundering_herd_cold_miss,GROUP=concurrency;P1,herd_size=15,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_invalidation_races_lookup,GROUP=concurrency;P1,race_queries=20,race_query_threads=3,race_invalidations=8,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    # P2
    test_thundering_herd_cold_miss,GROUP=concurrency;P2,herd_size=50,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    test_invalidation_races_lookup,GROUP=concurrency;P2,race_queries=40,race_query_threads=5,race_invalidations=12,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True

    # scale - test_scale_many_distinct_plans dropped from this conf. Its two
    # assertions (3 most-recent hit, 3 oldest evicted) are exactly
    # test_lru_recency_on_hit's LRU property at 100/150 instead of 2/3, and it
    # cost 618s. Same reasoning that already removed the 200/300 P2 sweep. The
    # full sweep conf is tracked separately.
    # P2
    test_scale_many_distinct_plans,GROUP=scale;P2,scale_capacity=200,scale_queries=300,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True

    # links - single cluster (S3 link, placeholder creds, DDL only)
    # 3 lines -> 1: `all` drives create -> alter -> drop as the sequence they
    # are, re-warming between each, so no separate link setup is needed.
    # P0
    test_link_ddl_invalidates,GROUP=links;P0,link_ddl=all,skip_setup_cleanup=True,skip_teardown_cleanup=True,skip_cbas_cleanup=True

    # topology - LAST
    # P1
    test_cross_node_shared_hit,nodes_init=2,GROUP=topology;P1,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    # P0
    test_rebalance_invalidates,nodes_init=2,GROUP=topology;P0,skip_teardown_cleanup=True,skip_cbas_cleanup=True
    # P1
    test_failover_invalidates,nodes_init=2,GROUP=topology;P1,failover_type=Hard,skip_teardown_cleanup=True,skip_cbas_cleanup=True
