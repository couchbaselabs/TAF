# Lighthouse SKU usage tests
# nodes_init=3    : 3 nodes so a non-master node can be rebalanced out while
#                   the cluster stays viable (needed by the removal case).
# num_of_clusters=1 : usage is a fleet-wide read; a second cluster only adds
#                   nodes to the same SKU row without proving anything extra.
# ucp_port=443    : default portal port.
#
# Reports are forced by dropping the collector interval to 1 s via diag/eval
# (report_interval_seconds) and waiting report_sleep_seconds, instead of the
# 2 h default. Raise report_sleep_seconds if the lab portal is slow to
# process a report.

lighthouse.entitlements.sku_usage_tests.SkuUsageTests:
    test_usage_without_matching_sku,nodes_init=3,num_of_clusters=1,ucp_port=443
    test_usage_with_sku_configured,nodes_init=3,num_of_clusters=1,ucp_port=443
    test_usage_decreases_when_node_removed,nodes_init=3,num_of_clusters=1,ucp_port=443
