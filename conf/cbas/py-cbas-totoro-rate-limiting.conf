# MB-45591 + KV rate limiting (throttling) with analytics on 8.5.0.
# data_service_rate_limiting=True enables throttling cluster-wide; the
# bucket_throttle_* limits are applied by CBASBaseTest after the initial KV
# load. tearDown fails if throttle_count_total did not increase after setUp:
# expect_cbas_throttling (Level 1, KV idle so the throttles are analytics DCP)
# and expect_bucket_throttling (Level 2, the bucket is throttled by the KV
# workload while analytics runs; this does not prove @cbas was throttled).
# Limits are units/sec per node, tuned on 8.5.0-1381 (4GB nodes): Level 1
# (200/400) is tripped by analytics ingestion alone; Level 2 (100/200) sits
# below the background KV workload (~20-30 units/sec) so the bucket is
# already throttled while analytics works.
# ini: 6 servers

cbas.cbas_collection_functional_test.CBASDatasetsAndCollections:
    # Level 1: KV workload is idle after setUp (well under limits); only analytics
    # DCP ingestion (@cbas is not Unthrottled) consumes units and trips the limit.
    test_create_drop_datasets,cluster_kv_infra=bkt_spec,bucket_spec=analytics.multi_bucket,cbas_spec=local_datasets,no_of_dv=5,no_of_threads=20,ds_per_dv=10,nodes_init=4,services_init=kv:n1ql-kv-cbas-cbas,dcp_stream_allocation_strategy=STARTING_POSITION,data_service_rate_limiting=True,bucket_throttle_reserved=200,bucket_throttle_hard_limit=400,expect_cbas_throttling=True,GROUP=cbas_totoro
