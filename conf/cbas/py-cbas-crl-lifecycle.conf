# Analytics Service CRL Lifecycle tests -- Analytics_CRL_Lifecycle_TestPlan.
#
# Covers plan sections 1 (client access to Analytics REST/Workbench), 2 (SQL++
# execution), 3 (Analytics Links to remote Couchbase clusters), 4 (links to an
# external S3 data source), 5 (shadow-data ingestion), 7 (multi-node
# distribution and rebalance), 9 (metrics, audit and log hygiene) and 10
# (negatives). Section 8 (upgrade / mixed-version) is not covered.
#
# Requires:
#   - Enterprise Edition (CRL is EE-only)
#   - at least one node running the Analytics service. Services come from the
#     services_init TEST PARAMETER, not from the .ini's `services:` field, so it
#     must be passed explicitly or the suite fails in setUp with
#     "Analytics CRL tests need a cbas node".
#   - FOUR servers. Most entries need two, the section 7 topology tests need
#     three (nodes_init=3), and test_link_revocation_does_not_affect_links_to_
#     other_clusters needs four (num_of_clusters=3, nodes_init=2|1|1).
#     b/resources/4-nodes-template-cbas.ini supplies them; the .ini only has
#     to provide servers, since CBASBaseTest builds its clusters from the
#     num_of_clusters / nodes_init / services_init parameters and ignores any
#     [clusterN] sections.
#   - the two section 4 tests need S3 credentials. They prefer
#     AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (optionally AWS_REGION,
#     AWS_S3_BUCKET, AWS_S3_ENDPOINT), the same variables AWSProvider and the
#     rest of TAF use, and fall back to LOCALSTACK_ENDPOINT /
#     LOCALSTACK_ACCESS_KEY_ID / LOCALSTACK_SECRET_ACCESS_KEY for a local
#     MinIO. They only create links -- no bucket is read, written or created
#     -- so credentials and a bucket name are enough. With neither set they
#     FAIL rather than skip, so exclude them explicitly if a job cannot reach
#     a store.
#
# Example:
#   python testrunner.py -i b/resources/4-nodes-template-cbas.ini \
#       -c conf/cbas/py-cbas-crl-lifecycle.conf
#
# Running the whole conf is the intended mode: every entry carries its own
# topology parameters. Invoking a single test with -t and no services_init
# fails in setUp with "Analytics CRL tests need a cbas node".
#
# NOTE ON POLICY MODES: the plan lists Disabled/Permissive/Strict/Require, but
# the server accepts only three -- clientAuth=Strict is rejected with
# "unknown mode: Strict" (HTTP 400), verified on 8.1.0-2632. These tests
# exercise Disabled, Permissive and Require.

cbas.cbas_crl_lifecycle.CBASCRLLifecycle:
    test_analytics_rejects_revoked_cert_and_honours_valid_one,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    test_analytics_enforcement_matches_ns_server_for_same_cert,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    test_analytics_hot_reload_revoke_and_restore,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    test_analytics_fails_closed_when_no_applicable_crl,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    test_analytics_revoked_cert_cannot_run_sqlpp_and_error_is_specific,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    # Scenarios added from unresolved reviewer comments on the plan, which the
    # plan text does not yet carry:
    #  - M. Blow: enforcement scopes must toggle without a driver/cbas restart,
    #    and Analytics must stay functional while a scope is disabled.
    #  - M. Blow: an already-authenticated long-running query is EXPECTED to
    #    complete even if its certificate is revoked mid-execution -- the
    #    opposite of what the plan's section 2 wording implies.
    # Plus two section 1 bullets not covered by the original five.
    test_enforcement_scope_toggles_without_restart,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    test_long_running_query_completes_despite_mid_execution_revocation,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    test_revocation_precedes_identity_mapping_and_rbac,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    test_valid_certs_work_for_each_analytics_rbac_role,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    # Section 10 (bypass and bad-CRL negatives), section 1's peer-vs-chain
    # bullet, and section 9's log-taxonomy bullet.
    test_no_password_fallback_for_revoked_cert_under_hybrid_mtls,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    test_tampered_and_untrusted_crls_are_not_applied,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    test_peer_only_vs_full_chain_revocation_checking,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    test_revocation_failure_reasons_are_distinguishable_in_logs,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    # Section 4 -- external data source links. Both need an S3-compatible
    # object store the Analytics node can reach; point LOCALSTACK_ENDPOINT /
    # LOCALSTACK_ACCESS_KEY_ID / LOCALSTACK_SECRET_ACCESS_KEY at MinIO, the
    # same variables the backup CRL suite uses. The third section-4 bullet, a
    # revoked Azure client certificate, needs Azure Blob and is not covered.
    test_s3_external_link_unaffected_by_crl_policy,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    test_s3_external_link_makes_no_revocation_checks,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    # Sections 6 and 9, plus section 1's cross-service parity bullet. None of
    # these need infrastructure beyond the running cluster. fts is added to
    # services_init so the parity test has a third service to compare.
    # Out of scope by decision: section 8 (upgrade / mixed-version), section
    # 1's Workbench UI bullet, and section 4's Azure client-certificate
    # bullet.
    test_diagnostics_verdict_matches_live_analytics_enforcement,nodes_init=2,services_init=kv:n1ql:index:fts-kv:cbas,GROUP=P0
    test_revocation_metrics_are_emitted_and_service_scoped,nodes_init=2,services_init=kv:n1ql:index:fts-kv:cbas,GROUP=P0
    test_audit_event_for_revoked_certificate_rejection,nodes_init=2,services_init=kv:n1ql:index:fts-kv:cbas,GROUP=P0
    test_expired_crl_is_visible_in_diagnostics,nodes_init=2,services_init=kv:n1ql:index:fts-kv:cbas,GROUP=P0
    test_enforcement_matches_kv_query_and_fts_for_same_cert,nodes_init=2,services_init=kv:n1ql:index:fts-kv:cbas,GROUP=P0
    # Section 3 -- Analytics Links to a REMOTE Couchbase cluster over mTLS.
    # A second, independent trust relationship: the certificate the LINK
    # presents outbound is validated by the remote cluster, so the policy and
    # the CRL that decide its fate are the remote's.
    #
    # These need more than one cluster. CBASBaseTest builds its clusters from
    # PARAMS -- it slices self.servers using num_of_clusters, nodes_init and
    # services_init -- and ignores the ini's own [clusterN] sections, so the
    # topology has to be spelled out on each line. Analytics services are
    # declared FIRST so compute/storage separation is not applied to a remote
    # cluster. The topology matches the form already proven by
    # conf/cbas/py-cbas-remote-links-datasets.conf.
    #
    # 3 nodes: C1 = kv:n1ql:index + kv:cbas, C2 = kv.
    test_remote_cluster_link_topology_is_usable,num_of_clusters=2,nodes_init=2|1,services_init=kv:n1ql:index-kv:cbas|kv,GROUP=P0
    test_remote_link_with_revoked_cert_fails_to_connect,num_of_clusters=2,nodes_init=2|1,services_init=kv:n1ql:index-kv:cbas|kv,GROUP=P0
    test_remote_link_error_distinguishes_revoked_unreachable_and_bad_creds,num_of_clusters=2,nodes_init=2|1,services_init=kv:n1ql:index-kv:cbas|kv,GROUP=P0
    test_remote_link_creation_and_edit_with_revoked_cert_fail_immediately,num_of_clusters=2,nodes_init=2|1,services_init=kv:n1ql:index-kv:cbas|kv,GROUP=P0
    test_remote_link_recovers_when_serial_removed_from_remote_crl,num_of_clusters=2,nodes_init=2|1,services_init=kv:n1ql:index-kv:cbas|kv,GROUP=P0
    test_link_certificate_material_not_exposed_on_revocation_failure,num_of_clusters=2,nodes_init=2|1,services_init=kv:n1ql:index-kv:cbas|kv,GROUP=P0
    # Isolation between remote clusters needs a THIRD cluster -- two links to
    # the same remote would not show it -- so this one wants 4 nodes:
    # C1 = kv:n1ql:index + kv:cbas, C2 = kv, C3 = kv.
    test_link_revocation_does_not_affect_links_to_other_clusters,num_of_clusters=3,nodes_init=2|1|1,services_init=kv:n1ql:index-kv:cbas|kv|kv,GROUP=P0

    # Section 5 -- shadow data and ingestion. Bullet 1 (revoking the
    # certificate used for KV-to-Analytics internal sync) is not directly
    # testable: that certificate is issued by the cluster's own generated
    # CA, so no CRL a test can sign applies to it. The test below asserts
    # the facts that decide the bullet's fate instead of skipping it.
    test_ingestion_undisturbed_by_unrelated_client_cert_revocation,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    test_internal_ingestion_certificate_is_not_test_revocable,nodes_init=2,services_init=kv:n1ql:index-kv:cbas,GROUP=P0
    # Section 7 -- topology. These are the only tests in this suite that
    # need TWO Analytics nodes in one cluster, and the rebalance-in case
    # needs a spare server beyond nodes_init, so run them on an ini with
    # more than three nodes.
    test_crl_enforcement_is_consistent_across_analytics_nodes,nodes_init=3,services_init=kv:n1ql:index-kv:cbas-kv:cbas,GROUP=P0
    test_new_analytics_node_inherits_crl_and_policy,nodes_init=3,services_init=kv:n1ql:index-kv:cbas-kv:cbas,GROUP=P0
    test_revocation_enforced_while_analytics_node_is_rebalanced_out,nodes_init=3,services_init=kv:n1ql:index-kv:cbas-kv:cbas,GROUP=P0
    # Section 5's replica bullets, which need the same two-Analytics-node
    # topology as section 7.
    test_promoted_analytics_replica_still_enforces_revocation,nodes_init=3,services_init=kv:n1ql:index-kv:cbas-kv:cbas,GROUP=P0
    # Section 10's two remaining bullets, both about using a link as the
    # bypass route, so they reuse the section-3 link-target fixture.
    test_revoked_link_cert_cannot_be_reused_for_a_new_or_disabled_link,num_of_clusters=2,nodes_init=2|1,services_init=kv:n1ql:index-kv:cbas|kv,GROUP=P0
    test_non_admin_cannot_change_link_certificate_configuration,num_of_clusters=2,nodes_init=2|1,services_init=kv:n1ql:index-kv:cbas|kv,GROUP=P0
