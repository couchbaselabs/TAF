# Internal-identity Password Check under mTLS -- MB-73874
# Couchbase Server 8.0.4+ (setting present, off by default)
#                   8.5.0+ (setting present, on by default)
# Enterprise Edition only -- client certificate authentication is EE-gated.

security.ipc_test.IPCTest:
    # Core exploit and fix validation
    test_forged_internal_cert_blocked_when_ipc_enabled,nodes_init=1,services_init=kv,GROUP=P0
    test_genuine_internal_cert_needs_credentials_when_ipc_enabled,nodes_init=1,services_init=kv,GROUP=P0

    # Core auth matrix and credential channels
    test_ipc_cca_state_auth_matrix,nodes_init=1,services_init=kv,GROUP=P0
    test_ipc_credential_channels_and_bypass_attempts,nodes_init=1,services_init=kv,GROUP=P0

    # Setting management
    test_ipc_setting_lifecycle_validation_and_rbac,nodes_init=1,services_init=kv,GROUP=P0
    test_ipc_setting_replication_and_persistence,nodes_init=3,services_init=kv-kv-kv,GROUP=P0_MULTI_NODE

    # Identity extraction, prefix-mapped certs and no narrowing
    test_ipc_internal_san_extraction_edge_cases,nodes_init=1,services_init=kv,GROUP=P0
    test_ipc_prefix_mapped_cert_regression_and_no_narrowing,nodes_init=1,services_init=kv,GROUP=P0

    # Node addition and join
    test_ipc_node_addition_credential_requirement,nodes_init=1,services_init=kv,GROUP=P0_MULTI_NODE
    test_ipc_node_addition_cross_ca_and_join_options,nodes_init=1,services_init=kv,GROUP=P1_MULTI_NODE
