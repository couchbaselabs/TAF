# 10k-collection variant of collections_with_ttl.conf.
#
# Same GROUP=collections_ttl_update test lines, but the two templates that
# preload docs are swapped for their _10k variants. The parent templates
# declare num_items at bucket level, so under this suite's
# collection_factor/collection_scale scaling every one of the ~4000 generated
# collections preloads 1000 docs. The load then runs for minutes, longer than
# the 100s collection maxTTL, so docs expire mid-load and the setUp doc-count
# validation never settles; remaining_docs=2000 is wrong at that scale too.
# The _10k templates pin those 2000 docs onto a fixed non-TTL scope instead,
# so the count holds at any collection_factor.
#
# collections_with_ttl.conf is left alone because max_ttl_7.0_P0 and
# max_ttl_update_7.6_P0 run the same lines unscaled and pass.

