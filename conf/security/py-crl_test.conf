# CRL (Certificate Revocation List) Test Suite — Couchbase Server 8.1+ Enterprise

security.crl_test.CRLTest:
    #Life cycle tests
    test_settings_and_file_lifecycle,nodes_init=1,services_init=kv,GROUP=P0

    #Crypto_Validation
    test_crl_trust_and_signature_boundary,nodes_init=1,services_init=kv,GROUP=P0
    test_crl_temporal_validity_lifecycle,nodes_init=1,services_init=kv,GROUP=P0

    #Settings_Policy
    test_crl_url_poll_ingestion,nodes_init=1,services_init=kv,GROUP=P0
    test_crl_settings_scope_independence_and_ingestion,nodes_init=1,services_init=kv,GROUP=P0

    #Policy_Mode_Matrix
    test_crl_policy_mode_matrix,nodes_init=1,services_init=kv,GROUP=P0

    #Security_Negative
    test_crl_tampered_duplicate_and_empty_crl_handling,nodes_init=1,services_init=kv,GROUP=P0

    #mTLS_Enforcement
    test_mtls_client_cert_auth_mode_matrix,nodes_init=1,services_init=kv,GROUP=P0
    test_mtls_revocation_ordering_and_cross_ca_isolation,nodes_init=1,services_init=kv,GROUP=P0

    #Diagnostics_Endpoint
    test_crl_diagnostics_endpoints,nodes_init=2,services_init=kv-kv,GROUP=P0

    #Auditing
    test_crl_auditing_logs_and_metrics,nodes_init=1,services_init=kv,GROUP=P0

    #RBAC
    test_crl_rbac_permission_boundaries,nodes_init=1,services_init=kv,GROUP=P0
