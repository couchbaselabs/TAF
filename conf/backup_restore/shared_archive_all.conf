# Shared Backup Archive – Concurrent Access Test Suite
#
# Covers all shared-archive scenarios for cbbackupmgr concurrent access.
#
# The 'provider' parameter does BOTH things with a single flag:
#   1. Tells ProvisionedBaseTestCase which cloud to deploy Capella clusters on.
#   2. Tells SharedArchiveBaseTest which archive scheme to use (s3/gs/az).
#
# All test defaults (cbbackupmgr_path, repo_name, obj_region, sample_bucket,
# backup_threads) are defined in shared_archive_base.py setUp().
# Override on the command line only when needed.
#
# Run the full suite (AWS, default):
#   python testrunner.py \
#     -i node.ini \
#     -c conf/backup_restore/shared_archive_all.conf \
#     -p rerun=False,get-cbcollect-info=False,skip_cluster_reset=True,GROUP=P0
#
# Run on GCP (deploys GCP Capella clusters, uses gs:// archive):
#   Set ADC first: gcloud auth application-default login
#   python testrunner.py \
#     -i node.ini \
#     -c conf/backup_restore/shared_archive_all.conf \
#     -p rerun=False,get-cbcollect-info=False,skip_cluster_reset=True,GROUP=P1:GCP
#
# Run on Azure (deploys Azure Capella clusters, uses az:// archive):
#   python testrunner.py \
#     -i node.ini \
#     -c conf/backup_restore/shared_archive_all.conf \
#     -p rerun=False,get-cbcollect-info=False,skip_cluster_reset=True,GROUP=P1:Azure

# =============================================================================
# AWS  (provider=aws, default)
# Cluster provisioning: AWS   Archive: s3://cbc-storage-<id>/backups
# =============================================================================

