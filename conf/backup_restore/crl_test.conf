# CRL (Certificate Revocation List) enforcement on backup/restore's own TLS
# paths -- Backup Service REST API (18097) and cbbackupmgr peer-certificate
# verification. See CRL_Backup_Restore_TestPlan (Drive) for the full P0 list;
# P0-07 (leader/follower gRPC), P0-11 (mid-backup revocation), and P0-14
# (external object store) are deferred and not covered here.
#
# Needs a Backup Service node distinct from the cluster master -- run against
# b/resources/continuous-backup-3-node.ini (nodes _2 and _3 carry the
# 'backup' service) with nodes_init=3 so all three nodes actually join the
# cluster.

backup_restore.crl_test.CRLBackupRestoreTest:
    test_backup_service_rest_revoked_and_valid_cert_rbac_unaffected,nodes_init=3,GROUP=P0
    test_backup_service_enforcement_order_and_hybrid_mtls_password_fallback,nodes_init=3,GROUP=P0
    test_backup_service_crl_hot_reload,nodes_init=3,GROUP=P0
    test_cbbackupmgr_revoked_cert_rejected_and_restore_rejects_before_mutation,nodes_init=3,GROUP=P0
    test_backup_validator_unreachable_fails_closed,nodes_init=3,GROUP=P0
    test_backup_crl_policy_disabled_is_noop_baseline,nodes_init=3,GROUP=P0
    # PRD P0 goal 11 -- peer-only vs full-chain revocation checking
    # (checkIntermediateCerts). Not one of the numbered P0 scenarios; found
    # by cross-referencing the PRD against the plan.
    test_peer_only_vs_full_chain_revocation_checking,nodes_init=3,GROUP=P0
    # Section L -- log quality: revocation failures must be distinguishable,
    # and no raw PEM / unhashed serials may reach backup_service.log.
    test_revocation_failures_are_distinguishable_and_leak_no_key_material,nodes_init=3,GROUP=P0
    # P0-14 needs an S3-compatible object store reachable from the backup node.
    # A MinIO fixture is installed on 172.23.220.215 (systemd unit
    # minio-p014.service, https://172.23.220.215:9000). Export before running:
    #   LOCALSTACK_ENDPOINT=https://172.23.220.215:9000
    #   LOCALSTACK_ACCESS_KEY_ID=minioadmin
    #   LOCALSTACK_SECRET_ACCESS_KEY=minioadmin123
    #   LOCALSTACK_CACERT=/opt/minio/certs/minio_ca.crt   (path ON the node)
    test_object_store_tls_unaffected_by_crl_policy,nodes_init=3,GROUP=P0
    # Scenario-coverage batch: plan sections A, D and F.
    #  - D: --no-ssl-verify must not bypass revocation of the CLIENT cert.
    #       (The other half of that bullet -- whether SERVER-cert revocation is
    #       skipped when verifiedChains is nil -- needs the nodeToNode scope
    #       and a revoked node cert, i.e. section C, and is not covered.)
    #  - F: DER-encoded CRLs enforced like PEM; untrusted-issuer and tampered
    #       CRLs never applied.
    #  - A: an expired-but-not-revoked cert fails chain validation, and is not
    #       misreported as revoked.
    test_no_ssl_verify_does_not_bypass_client_cert_revocation,nodes_init=3,GROUP=P0
    test_der_encoded_crl_is_enforced_like_pem,nodes_init=3,GROUP=P0
    test_untrusted_and_tampered_crls_are_not_applied,nodes_init=3,GROUP=P0
    test_expired_cert_fails_before_revocation_is_consulted,nodes_init=3,GROUP=P0
    # Section O (backup-owned half only) and the remaining section A bullets.
    # The plan's third section-O bullet -- no couchbase-cli CRL surface and
    # ssl-manage unchanged -- is deliberately NOT covered here: couchbase-cli
    # is ns_server's surface, and the plan's own Out of Scope section already
    # assigns ns_server's CLI to MB-32989 / the ns_server CRL Lifecycle Tests.
    test_backup_does_not_capture_crl_material_or_policy,nodes_init=3,GROUP=P0
    test_restore_does_not_alter_cluster_crl_configuration,nodes_init=3,GROUP=P0
    test_mutating_requests_enforce_revocation_like_reads,nodes_init=3,GROUP=P0
    test_plain_http_port_has_no_revocation_check,nodes_init=3,GROUP=P0
    test_chain_missing_intermediate_is_rejected,nodes_init=3,GROUP=P0
    test_concurrent_mixed_certs_are_judged_independently,nodes_init=3,GROUP=P0
    # Sections B and C. The outbound half of C -- revoked follower node cert,
    # leader failover with a revoked leader cert, intermediate CA revoked
    # beneath the outbound path -- needs the cluster's node certificates
    # reissued by the test CA and is not covered here.
    test_internal_grpc_listener_revocation_and_governing_scope,nodes_init=3,GROUP=P0
    test_internal_grpc_listener_survives_malformed_payloads,nodes_init=3,GROUP=P0
    test_internal_grpc_listener_handles_rapid_connections,nodes_init=3,GROUP=P0
    test_client_auth_and_node_to_node_scopes_are_independent,nodes_init=3,GROUP=P0
    # P0-07 and the outbound half of section C. Both need at least two
    # backup-service nodes so a follower's certificate can be revoked while
    # the master's stays valid.
    test_leader_to_follower_grpc_fails_specifically_on_revoked_peer_cert,nodes_init=3,services_init=kv:index:n1ql-kv:backup-kv:backup,GROUP=P0
    test_revoked_intermediate_ca_invalidates_node_certs_beneath_it,nodes_init=3,services_init=kv:index:n1ql-kv:backup-kv:backup,GROUP=P0
    # Section C node-certificate tests. The gate test comes first
    # deliberately: if reissuing node certs from the test CA is broken, every
    # test below it fails for a reason unrelated to revocation.
    test_node_certificates_from_test_ca_are_accepted,nodes_init=3,services_init=kv:index:n1ql-kv:backup-kv:backup,GROUP=P0
    test_revoked_node_certificate_is_scoped_to_node_to_node,nodes_init=3,services_init=kv:index:n1ql-kv:backup-kv:backup,GROUP=P0
