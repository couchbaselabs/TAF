# CRL (Certificate Revocation List) enforcement on backup/restore's own TLS
# paths -- Backup Service REST API (18097) and cbbackupmgr peer-certificate
# verification. See CRL_Backup_Restore_TestPlan (Drive) for the full P0 list;
# P0-07 (leader/follower gRPC), P0-11 (mid-backup revocation), and P0-14
# (external object store) are deferred and not covered here.
#
# Needs a Backup Service node distinct from the cluster master -- run against
# b/resources/continuous-backup-3-node.ini (nodes _2 and _3 carry the
# 'backup' service) with nodes_init=3 so all three nodes actually join the
# cluster.

backup_restore.crl_test.CRLBackupRestoreTest:
    test_backup_service_rest_revoked_and_valid_cert_rbac_unaffected,nodes_init=3,GROUP=P0
    test_backup_service_enforcement_order_and_hybrid_mtls_password_fallback,nodes_init=3,GROUP=P0
    test_backup_service_crl_hot_reload,nodes_init=3,GROUP=P0
    test_cbbackupmgr_revoked_cert_rejected_and_restore_rejects_before_mutation,nodes_init=3,GROUP=P0
    test_backup_validator_unreachable_fails_closed,nodes_init=3,GROUP=P0
    test_backup_crl_policy_disabled_is_noop_baseline,nodes_init=3,GROUP=P0
    # PRD P0 goal 11 -- peer-only vs full-chain revocation checking
    # (checkIntermediateCerts). Not one of the numbered P0 scenarios; found
    # by cross-referencing the PRD against the plan.
    test_peer_only_vs_full_chain_revocation_checking,nodes_init=3,GROUP=P0
    # Section L -- log quality: revocation failures must be distinguishable,
    # and no raw PEM / unhashed serials may reach backup_service.log.
    test_revocation_failures_are_distinguishable_and_leak_no_key_material,nodes_init=3,GROUP=P0
    # P0-14 needs an S3-compatible object store reachable from the backup node.
    # A MinIO fixture is installed on 172.23.220.215 (systemd unit
    # minio-p014.service, https://172.23.220.215:9000). Export before running:
    #   LOCALSTACK_ENDPOINT=https://172.23.220.215:9000
    #   LOCALSTACK_ACCESS_KEY_ID=minioadmin
    #   LOCALSTACK_SECRET_ACCESS_KEY=minioadmin123
    #   LOCALSTACK_CACERT=/opt/minio/certs/minio_ca.crt   (path ON the node)
    test_object_store_tls_unaffected_by_crl_policy,nodes_init=3,GROUP=P0
